                    <!-- Botões de Ação -->
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button @click="editInFormFromVoice" class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
                            Revisar no Form
                        </button>
                        <button @click="applyVoiceTransaction" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 shadow-md shadow-emerald-600/20">
                            <span>Confirmar Agora</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- ESTADO 6: ERRO (error) -->
                <div v-else-if="voiceState === 'error'" class="space-y-4 py-2 text-center">
                    <div class="p-3 bg-rose-50 border border-rose-200 rounded-2xl space-y-1">
                        <span class="text-2xl block">⚠️</span>
                        <p class="text-xs font-bold text-rose-900">Não foi possível concluir</p>
                        <p class="text-[11px] text-rose-700 leading-snug">{{ voiceErrorMessage }}</p>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button @click="voiceState = 'need_key'" class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
                            Verificar Chave
                        </button>
                        <button @click="voiceState = 'ready'" class="py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold transition">
                            Tentar de Novo
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </template>
</div>

<!-- ========================================== -->
<!-- SCRIPTS: FIREBASE, PERSISTÊNCIA & VUE LOGIC-->
<!-- ========================================== -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, enableMultiTabIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCXao0he_pS1dquJPGRbkjhFeeWPkQqxsw",
        authDomain: "gestorfaturas-4e199.firebaseapp.com",
        projectId: "gestorfaturas-4e199",
        storageBucket: "gestorfaturas-4e199.firebasestorage.app",
        messagingSenderId: "779508869408",
        appId: "1:779508869408:web:c1883d5d22832f1c254f45"
    };

    const fbApp = initializeApp(firebaseConfig);
    const auth = getAuth(fbApp);
    const db = getFirestore(fbApp);

    enableMultiTabIndexedDbPersistence(db).catch(() => {});

    const { createApp, ref, reactive, computed, watch, onMounted } = Vue;
    const COLOR_PALETTE = ['#2563eb', '#7c3aed', '#059669', '#d97706', '#dc2626', '#0891b2', '#4f46e5', '#db2777', '#ea580c', '#16a34a', '#9333ea'];

    createApp({
        setup() {
            const user = ref(null);
            const loading = ref(false);
            const authMode = ref('login');
            const authForm = reactive({ email: '', password: '' });
            const syncStatus = ref('idle');
            const currentTab = ref('lancamentos');
            const reportMonth = ref(new Date().toISOString().slice(0, 7));
            const searchQuery = ref('');
            const profileModalOpen = ref(false);
            const userPixKey = ref('');

            // IA & Lançamento por Voz (Groq Cloud)
            const groqApiKey = ref(localStorage.getItem('groq_api_key') || '');
            const groqModel = ref(localStorage.getItem('groq_model') || 'openai/gpt-oss-120b');
            const groqAutoConfirm = ref(localStorage.getItem('groq_auto_confirm') !== 'false');
            const showGroqKey = ref(false);
            const groqTesting = ref(false);

            const voiceModalOpen = ref(false);
            const voiceState = ref('ready'); // 'ready' | 'need_key' | 'recording' | 'processing' | 'review' | 'error'
            const voiceProcessingStep = ref('');
            const voiceRecordingDuration = ref(0);
            const voiceTranscription = ref('');
            const voiceParsedData = ref(null);
            const voiceAutoConfirmTimer = ref(3);
            const voiceErrorMessage = ref('');

            // Estrutura de dados principal
            const cards = ref([]);
            const people = ref(['Eu']);
            const transactions = ref([]);
            const payments = ref({});
            const personColors = ref({'Eu': '#2563eb'});

            // Formulários
            const formCard = reactive({ name: '', closingDay: 1, dueDay: 10 });
            const formTx = reactive({ 
                description: '', 
                amount: null, 
                amountType: 'total', 
                date: new Date().toISOString().slice(0, 10), 
                cardId: '', 
                person: 'Eu', 
                type: 'single', 
                installments: 2 
            });
            const newPerson = ref('');
            
            const isEditingTx = ref(null);
            const isEditingCard = ref(null);

            // Sistema de Toast e Modais Elegantes
            const toast = reactive({ show: false, message: '', type: 'info', icon: 'ℹ️' });
            let toastTimer = null;
            const showToast = (message, type = 'info') => {
                clearTimeout(toastTimer);
                toast.message = message;
                toast.type = type;
                toast.icon = type === 'success' ? '✅' : (type === 'error' ? '❌' : 'ℹ️');
                toast.show = true;
                toastTimer = setTimeout(() => { toast.show = false; }, 3000);
            };

            const confirmDialog = reactive({ show: false, title: '', message: '', onConfirm: null });
            const promptDialog = reactive({ show: false, title: '', message: '', value: '', onConfirm: null });

            // Sincronização com Cloud Firestore
            let unsubscribeStore = null;
            const startSync = (uid) => {
                const docRef = doc(db, 'artifacts', 'gestor-faturas', 'users', uid, 'appData', 'main');
                unsubscribeStore = onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        cards.value = data.cards || [];
                        people.value = data.people || ['Eu'];
                        transactions.value = data.transactions || [];
                        payments.value = data.payments || {};
                        personColors.value = data.personColors || {'Eu': '#2563eb'};
                        userPixKey.value = data.pixKey || '';
                        if (data.groqApiKey && !groqApiKey.value) groqApiKey.value = data.groqApiKey;
                        if (data.groqModel) groqModel.value = data.groqModel;
                        if (data.groqAutoConfirm !== undefined) groqAutoConfirm.value = data.groqAutoConfirm;
                        if (!formTx.cardId && cards.value.length > 0) formTx.cardId = cards.value[0].id;
                    }
                });
            };

            const pushToCloud = async () => {
                if (!user.value) return;
                syncStatus.value = 'syncing';
                try {
                    const docRef = doc(db, 'artifacts', 'gestor-faturas', 'users', user.value.uid, 'appData', 'main');
                    await setDoc(docRef, {
                        cards: cards.value, 
                        people: people.value, 
                        transactions: transactions.value,
                        payments: payments.value, 
                        personColors: personColors.value, 
                        pixKey: userPixKey.value,
                        groqApiKey: groqApiKey.value,
                        groqModel: groqModel.value,
                        groqAutoConfirm: groqAutoConfirm.value,
                        updatedAt: new Date().toISOString()
                    });
                } catch (e) { 
                    console.error("Erro ao sincronizar com nuvem:", e); 
                }
                syncStatus.value = 'idle';
            };

            let timer;
            watch([cards, people, transactions, payments, personColors, userPixKey, groqApiKey, groqModel, groqAutoConfirm], () => {
                clearTimeout(timer);
                timer = setTimeout(pushToCloud, 1800);
            }, { deep: true });

            // Autenticação
            const handleAuth = async () => {
                loading.value = true;
                try {
                    if (authMode.value === 'login') {
                        await signInWithEmailAndPassword(auth, authForm.email, authForm.password);
                        showToast("Bem-vindo de volta!", "success");
                    } else {
                        await createUserWithEmailAndPassword(auth, authForm.email, authForm.password);
                        showToast("Conta criada com sucesso!", "success");
                    }
                } catch (e) { 
                    showToast("Erro: " + (e.message.includes('auth/') ? 'Verifique suas credenciais' : e.message), "error"); 
                }
                loading.value = false;
            };

            const logout = () => {
                signOut(auth);
                profileModalOpen.value = false;
                showToast("Sessão encerrada.", "info");
            };

            onMounted(() => {
                onAuthStateChanged(auth, (u) => {
                    user.value = u;
                    if (u) startSync(u.uid);
                    else if (unsubscribeStore) unsubscribeStore();
                });
            });

            // Cores e Helpers de Formatação
            const getPersonColor = (name) => {
                if (!personColors.value[name]) {
                    personColors.value[name] = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
                }
                return personColors.value[name];
            };

            const formatMoney = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

            const formatDate = (dStr) => {
                if (!dStr) return '';
                const [y, m, d] = dStr.split('-');
                return `${d}/${m}`;
            };

            const formatMonthLabel = (yyyyMM) => {
                if (!yyyyMM) return '';
                const [y, m] = yyyyMM.split('-').map(Number);
                const date = new Date(y, m - 1, 1);
                return date.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            };

            const getCardName = (id) => cards.value.find(c => c.id === id)?.name || 'Cartão';

            // Navegação Rápida de Meses
            const navigateMonth = (delta) => {
                const [y, m] = reportMonth.value.split('-').map(Number);
                let targetM = m + delta;
                let targetY = y;
                if (targetM > 12) { targetM = 1; targetY++; }
                else if (targetM < 1) { targetM = 12; targetY--; }
                reportMonth.value = `${targetY}-${String(targetM).padStart(2, '0')}`;
            };

            // Cálculo dos Ciclos e Projeção das Faturas
            const getInvoiceMonth = (pDate, cDay, dDay) => {
                const [y, m, d] = pDate.split('-').map(Number);
                let targetM = m; let targetY = y;
                if (d >= (cDay || 31)) targetM++;
                if ((dDay || 10) <= (cDay || 31)) targetM++;
                while (targetM > 12) { targetM -= 12; targetY++; }
                return `${targetY}-${String(targetM).padStart(2, '0')}`;
            };

            const addMonths = (yyyyMM, n) => {
                const [y, m] = yyyyMM.split('-').map(Number);
                let tM = m + n; let tY = y;
                while (tM > 12) { tM -= 12; tY++; }
                return `${tY}-${String(tM).padStart(2, '0')}`;
            };

            const projectedInvoices = computed(() => {
                const invs = {};
                
                // Distribui os lançamentos nos meses
                transactions.value.forEach(tx => {
                    const card = cards.value.find(c => c.id === tx.cardId);
                    if (!card) return;
                    const startMonth = getInvoiceMonth(tx.date, card.closingDay, card.dueDay);
                    const reps = tx.type === 'subscription' ? 24 : (tx.type === 'installment' ? tx.installments : 1);
                    const val = tx.type === 'installment' ? tx.amount / tx.installments : tx.amount;
                    
                    for (let i = 0; i < reps; i++) {
                        const m = addMonths(startMonth, i);
                        if (!invs[m]) invs[m] = { total: 0, byPerson: {} };
                        if (!invs[m].byPerson[tx.person]) invs[m].byPerson[tx.person] = { total: 0, items: [] };
                        invs[m].total += val; 
                        invs[m].byPerson[tx.person].total += val;
                        invs[m].byPerson[tx.person].items.push({ 
                            id: tx.id, 
                            desc: tx.description, 
                            amount: val, 
                            parcelaInfo: tx.type === 'installment' ? `(${i+1}/${tx.installments})` : '',
                            isDebt: false
                        });
                    }
                });

                // Rolagem de Dívidas (Saldo Devedor Acumulado)
                const curMonthStr = new Date().toISOString().slice(0, 7);
                const maxRolloverMonth = addMonths(curMonthStr, 2); 
                
                let sortedMonths = Object.keys(invs).sort();
                for (let i = 0; i < sortedMonths.length; i++) {
                    const month = sortedMonths[i];
                    if (month >= maxRolloverMonth) continue;
                    
                    const nextMonth = addMonths(month, 1);
                    
                    for (const person in invs[month].byPerson) {
                        const personData = invs[month].byPerson[person];
                        const isPaid = payments.value[month]?.[person];
                        
                        if (!isPaid && personData.total > 0) {
                            if (!invs[nextMonth]) invs[nextMonth] = { total: 0, byPerson: {} };
                            if (!invs[nextMonth].byPerson[person]) invs[nextMonth].byPerson[person] = { total: 0, items: [] };
                            
                            const debtItem = {
                                id: `debt-${month}-${person}`,
                                desc: `⚠️ Saldo devedor de ${month.split('-')[1]}/${month.split('-')[0]}`,
                                amount: personData.total,
                                isDebt: true
                            };
                            
                            invs[nextMonth].byPerson[person].items.unshift(debtItem);
                            invs[nextMonth].byPerson[person].total += personData.total;
                            invs[nextMonth].total += personData.total;
                            
                            if (!sortedMonths.includes(nextMonth)) {
                                sortedMonths.push(nextMonth);
                                sortedMonths.sort();
                            }
                        }
                    }
                }
                
                return invs;
            });

            const currentInvoiceData = computed(() => projectedInvoices.value[reportMonth.value] || null);

            // Estatísticas do Mês Atual
            const reportStats = computed(() => {
                if (!currentInvoiceData.value) return { paidCount: 0, totalCount: 0, percentPaid: 0 };
                const byPerson = currentInvoiceData.value.byPerson;
                const peopleList = Object.keys(byPerson);
                const paidCount = peopleList.filter(p => payments.value[reportMonth.value]?.[p]).length;
                const totalCount = peopleList.length;
                const percentPaid = totalCount > 0 ? Math.round((paidCount / totalCount) * 100) : 0;
                return { paidCount, totalCount, percentPaid };
            });

            // Filtro de Transações com Busca
            const filteredTransactions = computed(() => {
                let list = [...transactions.value].reverse();
                if (searchQuery.value.trim()) {
                    const q = searchQuery.value.toLowerCase();
                    list = list.filter(t => 
                        (t.description || '').toLowerCase().includes(q) ||
                        (t.person || '').toLowerCase().includes(q) ||
                        getCardName(t.cardId).toLowerCase().includes(q)
                    );
                }
                return list;
            });

            // Ações de Lançamentos
            const addTransaction = () => {
                const finalAmt = (formTx.type === 'installment' && formTx.amountType === 'installment') 
                    ? formTx.amount * formTx.installments 
                    : formTx.amount;

                if (isEditingTx.value) {
                    const idx = transactions.value.findIndex(t => t.id === isEditingTx.value);
                    if (idx !== -1) transactions.value[idx] = { ...formTx, id: isEditingTx.value, amount: finalAmt };
                    cancelEditTx();
                    showToast("Lançamento atualizado!", "success");
                } else {
                    transactions.value.push({ ...formTx, id: Date.now().toString(), amount: finalAmt });
                    formTx.description = ''; 
                    formTx.amount = null;
                    showToast("Lançamento adicionado com sucesso!", "success");
                }
            };

            const editTransaction = (tx) => { 
                isEditingTx.value = tx.id; 
                Object.assign(formTx, tx); 
                currentTab.value = 'lancamentos'; 
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            };

            const editTransactionById = (id) => { 
                const tx = transactions.value.find(t => t.id === id); 
                if (tx) editTransaction(tx); 
            };

            const cancelEditTx = () => { 
                isEditingTx.value = null; 
                formTx.description = ''; 
                formTx.amount = null; 
            };

            const confirmDeleteTx = (id) => {
                confirmDialog.title = "Excluir Lançamento";
                confirmDialog.message = "Tem certeza que deseja remover esta despesa permanentemente?";
                confirmDialog.onConfirm = () => {
                    transactions.value = transactions.value.filter(t => t.id !== id);
                    confirmDialog.show = false;
                    showToast("Lançamento excluído.", "info");
                };
                confirmDialog.show = true;
            };

            // Ações de Cartões
            const addCard = () => {
                if (isEditingCard.value) {
                    const idx = cards.value.findIndex(c => c.id === isEditingCard.value);
                    if (idx !== -1) cards.value[idx] = { ...formCard, id: isEditingCard.value };
                    cancelEditCard();
                    showToast("Cartão atualizado!", "success");
                } else {
                    cards.value.push({ ...formCard, id: Date.now().toString() });
                    formCard.name = '';
                    showToast("Novo cartão cadastrado!", "success");
                }
            };

            const editCard = (card) => { 
                isEditingCard.value = card.id; 
                Object.assign(formCard, card); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const cancelEditCard = () => { 
                isEditingCard.value = null; 
                formCard.name = ''; 
            };

            const confirmDeleteCard = (id) => {
                confirmDialog.title = "Excluir Cartão";
                confirmDialog.message = "A exclusão do cartão afetará os lançamentos vinculados a ele. Deseja prosseguir?";
                confirmDialog.onConfirm = () => {
                    cards.value = cards.value.filter(c => c.id !== id);
                    confirmDialog.show = false;
                    showToast("Cartão removido.", "info");
                };
                confirmDialog.show = true;
            };

            // Ações de Pessoas
            const addPerson = () => { 
                const trimmed = (newPerson.value || '').trim();
                if (trimmed && !people.value.includes(trimmed)) { 
                    people.value.push(trimmed); 
                    newPerson.value = ''; 
                    showToast(`${trimmed} adicionado(a)!`, "success");
                } 
            };

            const openEditPersonModal = (oldName) => {
                promptDialog.title = "Renomear Pessoa";
                promptDialog.message = `Informe o novo nome para ${oldName}:`;
                promptDialog.value = oldName;
                promptDialog.onConfirm = () => {
                    const n = (promptDialog.value || '').trim();
                    if (n && n !== oldName) {
                        if (people.value.includes(n)) { 
                            showToast("Este nome já existe!", "error"); 
                            return; 
                        }
                        const idx = people.value.indexOf(oldName);
                        people.value[idx] = n;
                        personColors.value[n] = personColors.value[oldName];
                        delete personColors.value[oldName];
                        transactions.value.forEach(tx => { if(tx.person === oldName) tx.person = n; });
                        promptDialog.show = false;
                        showToast("Nome atualizado com sucesso!", "success");
                    } else {
                        promptDialog.show = false;
                    }
                };
                promptDialog.show = true;
            };

            const confirmRemovePerson = (p) => {
                confirmDialog.title = "Remover Pessoa";
                confirmDialog.message = `Deseja remover ${p} da lista de devedores?`;
                confirmDialog.onConfirm = () => {
                    people.value = people.value.filter(x => x !== p);
                    confirmDialog.show = false;
                    showToast(`${p} removido(a).`, "info");
                };
                confirmDialog.show = true;
            };

            const handlePersonSelectChange = () => { 
                if (formTx.person === 'NEW_PERSON') { 
                    promptDialog.title = "Nova Pessoa";
                    promptDialog.message = "Digite o nome da pessoa a ser adicionada:";
                    promptDialog.value = '';
                    promptDialog.onConfirm = () => {
                        const n = (promptDialog.value || '').trim();
                        if (n) {
                            if (!people.value.includes(n)) people.value.push(n);
                            formTx.person = n;
                        } else {
                            formTx.person = 'Eu';
                        }
                        promptDialog.show = false;
                    };
                    promptDialog.show = true;
                } 
            };

            const clearPastDebts = (person) => {
                confirmDialog.title = "Quitar Histórico de Dívidas";
                confirmDialog.message = `Deseja marcar todos os meses ANTERIORES ao mês atual como pagos para ${person}? Isso limpará os saldos devedores passados.`;
                confirmDialog.onConfirm = () => {
                    const curMonthStr = new Date().toISOString().slice(0, 7);
                    let count = 0;
                    for (const month in projectedInvoices.value) {
                        if (month < curMonthStr) {
                            if (projectedInvoices.value[month].byPerson[person] && projectedInvoices.value[month].byPerson[person].total > 0) {
                                if (!payments.value[month]) payments.value[month] = {};
                                if (!payments.value[month][person]) {
                                    payments.value[month][person] = true;
                                    count++;
                                }
                            }
                        }
                    }
                    confirmDialog.show = false;
                    showToast(`Histórico limpo! ${count} faturas passadas marcadas como pagas.`, "success");
                };
                confirmDialog.show = true;
            };

            const togglePayment = (m, p) => { 
                if (!payments.value[m]) payments.value[m] = {};
                if (payments.value[m][p]) delete payments.value[m][p];
                else payments.value[m][p] = true;
            };

            const savePixKey = () => {
                showToast("Chave PIX atualizada!", "success");
            };

            const exportToWhatsApp = (name, total, items) => {
                let msg = `💳 *Fatura: ${formatMonthLabel(reportMonth.value)}*\n`;
                msg += `Olá *${name}*, segue o resumo da sua parte no cartão: *${formatMoney(total)}*\n\n`;
                msg += `📋 *Detalhamento:*\n`;
                items.forEach(i => {
                    msg += `• ${i.desc} ${i.parcelaInfo ? `_(${i.parcelaInfo.replace(/[()]/g, '')})_` : ''}: ${formatMoney(i.amount)}\n`;
                });
                
                if (userPixKey.value && userPixKey.value.trim()) {
                    msg += `\n⚡ *Chave PIX para pagamento:*\n\`${userPixKey.value.trim()}\`\n`;
                }
                
                msg += `\n_Mensagem gerada pelo Gestor de Faturas_ ✨`;
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
            };

            const exportBackup = () => {
                const data = { 
                    appName: 'GestorDeCartoes', 
                    cards: cards.value, 
                    people: people.value, 
                    transactions: transactions.value, 
                    payments: payments.value, 
                    personColors: personColors.value,
                    pixKey: userPixKey.value,
                    exportedAt: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); 
                a.href = url; 
                a.download = `Backup_Gestor_${new Date().toISOString().slice(0,10)}.json`; 
                a.click();
                showToast("Arquivo de backup baixado com sucesso!", "success");
            };

            const importBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.transactions || data.cards) {
                            cards.value = data.cards || []; 
                            people.value = data.people || []; 
                            transactions.value = data.transactions || []; 
                            payments.value = data.payments || {}; 
                            personColors.value = data.personColors || {};
                            userPixKey.value = data.pixKey || '';
                            showToast("Backup importado com sucesso!", "success");
                        } else {
                            showToast("Arquivo JSON inválido.", "error");
                        }
                    } catch (err) {
                        showToast("Falha ao ler arquivo JSON.", "error");
                    }
                };
                reader.readAsText(file);
            };

            // ==========================================
            // RECURSOS DE IA & VOZ (GROQ CLOUD)
            // ==========================================
            let voiceMediaRecorder = null;
            let voiceAudioChunks = [];
            let voiceRecordingInterval = null;
            let voiceAutoConfirmInterval = null;

            const formatDuration = (sec) => {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            };

            const cancelAutoConfirm = () => {
                if (voiceAutoConfirmInterval) {
                    clearInterval(voiceAutoConfirmInterval);
                    voiceAutoConfirmInterval = null;
                }
                voiceAutoConfirmTimer.value = 0;
            };

            const saveGroqSettings = () => {
                localStorage.setItem('groq_api_key', (groqApiKey.value || '').trim());
                localStorage.setItem('groq_model', (groqModel.value || '').trim() || 'openai/gpt-oss-120b');
                localStorage.setItem('groq_auto_confirm', groqAutoConfirm.value ? 'true' : 'false');
                pushToCloud();
                showToast("Configurações de IA salvas com sucesso!", "success");
                if (voiceState.value === 'need_key') {
                    voiceState.value = 'ready';
                }
            };

            const testGroqConnection = async () => {
                if (!groqApiKey.value || !groqApiKey.value.trim()) {
                    showToast("Por favor, insira sua chave Groq primeiro.", "error");
                    return;
                }
                groqTesting.value = true;
                try {
                    const res = await fetch('https://api.groq.com/openai/v1/models', {
                        headers: { 'Authorization': `Bearer ${groqApiKey.value.trim()}` }
                    });
                    if (res.ok) {
                        showToast("Conexão com a Groq Cloud realizada com sucesso!", "success");
                    } else {
                        const err = await res.json().catch(() => ({}));
                        showToast(`Erro na Groq: ${err?.error?.message || res.statusText}`, "error");
                    }
                } catch (e) {
                    showToast(`Falha ao conectar: ${e.message}`, "error");
                } finally {
                    groqTesting.value = false;
                }
            };

            const openVoiceModal = () => {
                cancelAutoConfirm();
                voiceErrorMessage.value = '';
                voiceTranscription.value = '';
                voiceParsedData.value = null;
                voiceRecordingDuration.value = 0;
                if (!groqApiKey.value || !groqApiKey.value.trim()) {
                    voiceState.value = 'need_key';
                } else {
                    voiceState.value = 'ready';
                }
                voiceModalOpen.value = true;
            };

            const closeVoiceModal = () => {
                cancelAutoConfirm();
                if (voiceMediaRecorder && voiceMediaRecorder.state === 'recording') {
                    try { voiceMediaRecorder.stop(); } catch(e){}
                }
                if (voiceRecordingInterval) {
                    clearInterval(voiceRecordingInterval);
                    voiceRecordingInterval = null;
                }
                voiceModalOpen.value = false;
                voiceState.value = 'ready';
            };

            const startVoiceRecording = async () => {
                if (!groqApiKey.value || !groqApiKey.value.trim()) {
                    voiceState.value = 'need_key';
                    return;
                }

                voiceErrorMessage.value = '';
                voiceTranscription.value = '';
                voiceParsedData.value = null;
                voiceRecordingDuration.value = 0;
                cancelAutoConfirm();

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    let mimeType = 'audio/webm;codecs=opus';
                    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mimeType)) {
                        if (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
                        else if (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
                        else mimeType = '';
                    }

                    voiceAudioChunks = [];
                    voiceMediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

                    voiceMediaRecorder.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) {
                            voiceAudioChunks.push(event.data);
                        }
                    };

                    voiceMediaRecorder.onstop = async () => {
                        clearInterval(voiceRecordingInterval);
                        voiceRecordingInterval = null;
                        stream.getTracks().forEach(track => track.stop());

                        if (voiceAudioChunks.length === 0) {
                            voiceState.value = 'error';
                            voiceErrorMessage.value = 'Nenhum áudio foi capturado. Fale novamente.';
                            return;
                        }

                        const audioBlob = new Blob(voiceAudioChunks, { type: voiceMediaRecorder.mimeType || 'audio/webm' });
                        await processVoicePipeline(audioBlob);
                    };

                    voiceMediaRecorder.start();
                    voiceState.value = 'recording';

                    voiceRecordingInterval = setInterval(() => {
                        voiceRecordingDuration.value++;
                    }, 1000);

                } catch (err) {
                    console.error("Erro ao iniciar gravação de voz:", err);
                    voiceState.value = 'error';
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        voiceErrorMessage.value = 'Permissão de microfone negada. Autorize o microfone no navegador para gravar.';
                    } else {
                        voiceErrorMessage.value = `Erro ao acessar microfone: ${err.message}`;
                    }
                }
            };

            const stopVoiceRecording = () => {
                if (voiceMediaRecorder && voiceMediaRecorder.state === 'recording') {
                    voiceMediaRecorder.stop();
                }
            };

            const cancelVoiceRecording = () => {
                if (voiceMediaRecorder && voiceMediaRecorder.state === 'recording') {
                    voiceMediaRecorder.onstop = null;
                    try { voiceMediaRecorder.stop(); } catch(e){}
                }
                if (voiceRecordingInterval) {
                    clearInterval(voiceRecordingInterval);
                    voiceRecordingInterval = null;
                }
                voiceState.value = 'ready';
            };

            const processVoicePipeline = async (audioBlob) => {
                voiceState.value = 'processing';
                try {
                    // ETAPA 1: Transcrição com Whisper V3 Large na Groq Cloud
                    voiceProcessingStep.value = 'Transcrevendo com Whisper V3 Large...';
                    const text = await transcribeAudioWithWhisper(audioBlob);
                    if (!text || !text.trim()) {
                        throw new Error('Não foi possível identificar nenhuma fala no áudio. Fale mais perto do microfone.');
                    }
                    voiceTranscription.value = text.trim();

                    // ETAPA 2: Extração Estruturada com Modelo de IA na Groq Cloud
                    const modelName = groqModel.value || 'openai/gpt-oss-120b';
                    voiceProcessingStep.value = `Estruturando dados com ${modelName}...`;
                    const parsedData = await parseExpenseWithGroq(text.trim());
                    voiceParsedData.value = parsedData;

                    // ETAPA 3: Conclusão e Preparo para Confirmação / Auto-salvamento
                    voiceState.value = 'review';

                    if (groqAutoConfirm.value) {
                        voiceAutoConfirmTimer.value = 3;
                        voiceAutoConfirmInterval = setInterval(() => {
                            voiceAutoConfirmTimer.value--;
                            if (voiceAutoConfirmTimer.value <= 0) {
                                cancelAutoConfirm();
                                applyVoiceTransaction();
                            }
                        }, 1000);
                    }

                } catch (err) {
                    console.error("Falha no pipeline de IA da Groq:", err);
                    voiceState.value = 'error';
                    voiceErrorMessage.value = err.message || 'Falha ao processar comando de voz.';
                }
            };

            const transcribeAudioWithWhisper = async (audioBlob) => {
                const mimeType = voiceMediaRecorder?.mimeType || 'audio/webm';
                let ext = 'webm';
                if (mimeType.includes('mp4')) ext = 'mp4';
                else if (mimeType.includes('ogg')) ext = 'ogg';
                else if (mimeType.includes('wav')) ext = 'wav';

                const audioFile = new File([audioBlob], `audio.${ext}`, { type: mimeType });
                const formData = new FormData();
                formData.append('file', audioFile);
                formData.append('model', 'whisper-large-v3');
                formData.append('language', 'pt');
                formData.append('response_format', 'json');
                formData.append('prompt', 'Lançamento de compras no cartão de crédito, faturas, valores em reais, parcelas e nomes de pessoas');

                const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${groqApiKey.value.trim()}`
                    },
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err?.error?.message || `Erro no Whisper V3 (${res.status})`);
                }

                const json = await res.json();
                return json.text;
            };

            const parseExpenseWithGroq = async (transcriptionText) => {
                const cardsList = cards.value.map(c => ({ id: c.id, name: c.name }));
                const peopleList = people.value;
                const today = new Date().toISOString().slice(0, 10);

                const systemPrompt = `Você é um assistente financeiro inteligente do app 'Gestor de Faturas'.
Sua tarefa é analisar a fala do usuário sobre uma despesa ou compra e extrair os dados estruturados com extrema exatidão.

DATA DE REFERÊNCIA (HOJE): ${today}
CARTÕES CADASTRADOS: ${JSON.stringify(cardsList)}
PESSOAS CADASTRADAS: ${JSON.stringify(peopleList)}

REGRAS:
1. "description": Título claro e conciso da despesa ou estabelecimento (ex: "Supermercado", "Almoço", "Tênis Nike", "Gasolina", "Academia").
2. "amount": Valor monetário em número float positivo (ex: 150.00).
3. "amountType": "total" (se o valor for o total da compra) ou "installment" (se for o valor falado de cada parcela). Padrão: "total".
4. "type": "single" (à vista), "installment" (parcelado), ou "subscription" (mensal, assinatura, recorrente).
5. "installments": Número inteiro de parcelas (mínimo 2 se for parcelado; 1 se for à vista ou assinatura).
6. "person": Nome da pessoa dona do gasto. Se o usuário disser "eu", "para mim", "minha", use "Eu". Se disser o nome de alguém, procure entre as pessoas cadastradas ou use o nome falado com inicial maiúscula.
7. "cardId": Se o usuário citou algum cartão, procure o cartão correspondente e retorne o seu "id". Se não mencionou nenhum cartão ou não encontrou, retorne o id do primeiro cartão: "${cardsList[0]?.id || ''}".
8. "date": Data da compra no formato YYYY-MM-DD. "hoje" = ${today}, "ontem" = dia anterior. Se não informado, use ${today}.
9. "summary": Frase curta de resumo (ex: "Supermercado de R$ 150,00 em 3x para Eu").

Responda ESTRITAMENTE em formato JSON compatível com a estrutura acima.`;

                const requestedModel = (groqModel.value || 'openai/gpt-oss-120b').trim();
                const modelsToTry = [requestedModel];
                if (requestedModel === 'openai/gpt-oss-120b') modelsToTry.push('gpt-oss-120b');
                else if (requestedModel === 'gpt-oss-120b') modelsToTry.push('openai/gpt-oss-120b');
                if (!modelsToTry.includes('qwen-2.5-32b')) modelsToTry.push('qwen-2.5-32b');
                if (!modelsToTry.includes('llama-3.3-70b-versatile')) modelsToTry.push('llama-3.3-70b-versatile');

                let lastError = null;
                for (const mod of modelsToTry) {
                    try {
                        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${groqApiKey.value.trim()}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                model: mod,
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: transcriptionText }
                                ],
                                response_format: { type: 'json_object' },
                                temperature: 0.1
                            })
                        });

                        if (res.ok) {
                            const data = await res.json();
                            const content = data.choices?.[0]?.message?.content;
                            const parsed = JSON.parse(content);

                            if (!parsed.description) parsed.description = 'Compra por voz';
                            parsed.amount = Number(parsed.amount) || 0;
                            if (!parsed.type) parsed.type = 'single';
                            if (!parsed.installments || isNaN(Number(parsed.installments))) {
                                parsed.installments = parsed.type === 'installment' ? 2 : 1;
                            } else {
                                parsed.installments = Number(parsed.installments);
                            }
                            if (!parsed.person) parsed.person = 'Eu';
                            if (!parsed.cardId && cards.value.length > 0) parsed.cardId = cards.value[0].id;
                            if (!parsed.date) parsed.date = today;
                            return parsed;
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            lastError = new Error(errData?.error?.message || `Erro no modelo ${mod} (${res.status})`);
                            if (res.status === 401 || res.status === 403) throw lastError;
                        }
                    } catch (e) {
                        lastError = e;
                        if (e.message && (e.message.includes('401') || e.message.includes('invalid_api_key'))) {
                            throw e;
                        }
                    }
                }
                throw lastError || new Error("Não foi possível interpretar os dados da compra.");
            };

            const applyVoiceTransaction = () => {
                cancelAutoConfirm();
                if (!voiceParsedData.value) return;

                const data = voiceParsedData.value;
                let personName = (data.person || 'Eu').trim();
                if (personName.toLowerCase() === 'eu') {
                    personName = 'Eu';
                } else {
                    personName = personName.charAt(0).toUpperCase() + personName.slice(1);
                }

                // Se a pessoa for nova, adiciona automaticamente à lista
                if (!people.value.includes(personName)) {
                    people.value.push(personName);
                    getPersonColor(personName);
                }

                // Garante cartão válido
                let targetCardId = data.cardId;
                if (!cards.value.some(c => c.id === targetCardId)) {
                    targetCardId = cards.value[0]?.id || '';
                }

                const installments = (data.type === 'installment' && Number(data.installments) > 1) 
                    ? Number(data.installments) 
                    : 1;
                const parsedAmt = Number(data.amount) || 0;
                const finalAmt = (data.type === 'installment' && data.amountType === 'installment') 
                    ? parsedAmt * installments 
                    : parsedAmt;

                const newTx = {
                    id: Date.now().toString(),
                    description: data.description || 'Compra por voz',
                    amount: finalAmt,
                    amountType: data.amountType || 'total',
                    date: data.date || new Date().toISOString().slice(0, 10),
                    cardId: targetCardId,
                    person: personName,
                    type: data.type || (installments > 1 ? 'installment' : 'single'),
                    installments: installments
                };

                transactions.value.push(newTx);
                pushToCloud();
                showToast(`Lançamento realizado: ${newTx.description} (${formatMoney(newTx.amount)})`, "success");
                closeVoiceModal();
            };

            const editInFormFromVoice = () => {
                cancelAutoConfirm();
                if (!voiceParsedData.value) return;

                const data = voiceParsedData.value;
                let personName = (data.person || 'Eu').trim();
                if (personName.toLowerCase() === 'eu') {
                    personName = 'Eu';
                } else {
                    personName = personName.charAt(0).toUpperCase() + personName.slice(1);
                }

                if (!people.value.includes(personName)) {
                    people.value.push(personName);
                    getPersonColor(personName);
                }

                formTx.description = data.description || '';
                formTx.amount = data.amount || null;
                formTx.amountType = data.amountType || 'total';
                formTx.type = data.type || 'single';
                formTx.installments = data.installments || 2;
                formTx.person = personName;
                formTx.cardId = data.cardId || (cards.value[0]?.id || '');
                formTx.date = data.date || new Date().toISOString().slice(0, 10);

                closeVoiceModal();
                currentTab.value = 'lancamentos';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast("Dados transferidos para o formulário. Revise e salve!", "info");
            };

            return {
                user, loading, authMode, authForm, handleAuth, logout, syncStatus,
                currentTab, reportMonth, cards, people, transactions, payments,
                formCard, formTx, newPerson, isEditingTx, isEditingCard, searchQuery,
                filteredTransactions, reportStats, profileModalOpen, userPixKey,
                toast, confirmDialog, promptDialog, showToast,
                addTransaction, editTransaction, editTransactionById, cancelEditTx, confirmDeleteTx,
                addCard, editCard, cancelEditCard, confirmDeleteCard,
                addPerson, openEditPersonModal, confirmRemovePerson, handlePersonSelectChange, clearPastDebts,
                togglePayment, getPersonColor, currentInvoiceData, formatMoney, formatDate, formatMonthLabel,
                getCardName, navigateMonth, savePixKey, exportToWhatsApp, exportBackup, importBackup,
                groqApiKey, groqModel, groqAutoConfirm, showGroqKey, groqTesting,
                saveGroqSettings, testGroqConnection,
                voiceModalOpen, voiceState, voiceProcessingStep, voiceRecordingDuration,
                voiceTranscription, voiceParsedData, voiceAutoConfirmTimer, voiceErrorMessage,
                openVoiceModal, closeVoiceModal, startVoiceRecording, stopVoiceRecording,
                cancelVoiceRecording, cancelAutoConfirm, applyVoiceTransaction, editInFormFromVoice, formatDuration
            };
        }
    }).mount('#app');

    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
</script>
</body>
</html>
