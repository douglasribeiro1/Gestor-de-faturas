<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gestor de Faturas</title>
    <meta name="description" content="Gerenciador compartilhado de faturas e cartões de crédito.">
    <meta name="theme-color" content="#f4f5fa">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Faturas">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">

    <script>
        // Aplica o tema antes da primeira pintura (evita "piscar" claro/escuro).
        try {
            var t = localStorage.getItem('theme') || 'auto';
            var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
    </script>
    <script src="./vendor/vue.global.prod.js"></script>
</head>
<body>

<!-- Ícones (sprite) -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h8M20 6h-2M4 12h2M20 12h-8M4 18h10M20 18h-2"/><circle cx="15" cy="6" r="2.4"/><circle cx="9" cy="12" r="2.4"/><circle cx="17" cy="18" r="2.4"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M19 12H9"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6 6 0 0 0-4-5.6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 3 3-3 3M3 11V9a4 4 0 0 1 4-4h13M7 22l-3-3 3-3M21 13v2a4 4 0 0 1-4 4H4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12.03 3a8.9 8.9 0 0 0-7.6 13.5L3 21l4.6-1.4A8.9 8.9 0 1 0 12.03 3zm5.1 12.4c-.2.6-1.2 1.1-1.7 1.2-.4.1-1 .1-1.6-.1a14 14 0 0 1-1.5-.5c-2.6-1.1-4.3-3.7-4.4-3.9-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></symbol>
</svg>

<div id="app" v-cloak class="app">

    <!-- ======================= CARREGANDO ======================= -->
    <div v-if="!authReady" class="auth" style="align-items:center">
        <img src="./icons/icon-192.png" alt="" width="72" height="72" style="border-radius:20px">
    </div>

    <!-- ======================= LOGIN / CADASTRO ======================= -->
    <div v-else-if="!user" class="auth">
        <div class="logo">
            <img src="./icons/icon-192.png" alt="Gestor de Faturas">
            <h1>Gestor de Faturas</h1>
            <p>Cartões, faturas e divisões compartilhadas, sem complicação.</p>
        </div>

        <div class="card stack">
            <div class="seg">
                <button type="button" :class="{ on: authMode === 'login' }" @click="authMode = 'login'">Entrar</button>
                <button type="button" :class="{ on: authMode === 'signup' }" @click="authMode = 'signup'">Criar conta</button>
            </div>
            <form class="stack" @submit.prevent="handleAuth">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" class="input" v-model="authForm.email" type="email" required autocomplete="email" inputmode="email" placeholder="voce@email.com">
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <div class="prefix">
                        <input id="password" class="input" style="padding-left:14px;padding-right:72px" v-model="authForm.password"
                               :type="showPassword ? 'text' : 'password'" required minlength="6"
                               :autocomplete="authMode === 'login' ? 'current-password' : 'new-password'" placeholder="Mínimo de 6 caracteres">
                        <button type="button" class="link" style="position:absolute;right:14px;top:50%;transform:translateY(-50%)" @click="showPassword = !showPassword">
                            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
                        </button>
                    </div>
                </div>
                <button class="btn primary block" type="submit" :disabled="loading">
                    {{ loading ? 'Aguarde…' : (authMode === 'login' ? 'Entrar' : 'Criar conta') }}
                </button>
                <button v-if="authMode === 'login'" type="button" class="link" @click="resetPassword">Esqueci minha senha</button>
            </form>
        </div>
        <p class="hint" style="text-align:center">Seus dados ficam sincronizados na nuvem e disponíveis offline.</p>
    </div>

    <!-- ======================= APLICATIVO ======================= -->
    <template v-else>
        <header class="topbar">
            <div class="brand">
                <img src="./icons/icon-192.png" alt="">
                <div class="min-w-0">
                    <h1>Gestor de Faturas</h1>
                    <div class="sync"><span class="dot" :class="syncDotClass"></span>{{ syncLabel }}</div>
                </div>
            </div>
            <div class="top-actions">
                <button class="icon-btn brand-fill" @click="openVoiceModal" aria-label="Lançar por voz"><svg class="i"><use href="#i-mic"/></svg></button>
                <button class="icon-btn avatar" @click="profileModalOpen = true" aria-label="Conta">{{ initial(user.email) }}</button>
            </div>
        </header>

        <main class="page">
            <transition name="fade" mode="out-in">

                <!-- ================= INÍCIO ================= -->
                <div v-if="currentTab === 'home'" key="home" class="stack" style="gap:14px">

                    <div class="month-nav">
                        <button class="icon-btn" @click="navigateMonth(-1)" aria-label="Mês anterior"><svg class="i"><use href="#i-left"/></svg></button>
                        <div class="label">
                            <strong>{{ formatMonthLabel(viewMonth) }}</strong>
                            <button v-if="!isCurrentMonth" @click="goToday">Voltar para hoje</button>
                            <input v-model="viewMonth" type="month" aria-label="Escolher mês">
                        </div>
                        <button class="icon-btn" @click="navigateMonth(1)" aria-label="Próximo mês"><svg class="i"><use href="#i-right"/></svg></button>
                    </div>

                    <!-- Primeiros passos -->
                    <div v-if="noCards" class="card stack" style="text-align:center">
                        <span style="font-size:40px">💳</span>
                        <div><strong style="font-size:17px">Vamos começar</strong>
                            <p class="hint" style="margin:4px 0 0">Cadastre seu primeiro cartão com os dias de fechamento e vencimento para que as faturas sejam calculadas.</p></div>
                        <button class="btn primary" @click="goTab('settings'); openNewCard()">Cadastrar cartão</button>
                    </div>

                    <template v-else>
                        <div class="hero">
                            <div class="label">Fatura do mês</div>
                            <div class="value num">{{ formatCents(dash.charges) }}</div>
                            <div class="row" style="flex-wrap:wrap;gap:6px;position:relative;z-index:1">
                                <span v-if="dash.delta !== null" class="pill">{{ dash.delta > 0 ? '▲' : (dash.delta < 0 ? '▼' : '=') }} {{ Math.abs(dash.delta) }}% vs. mês anterior</span>
                                <span v-else class="pill">Sem mês anterior para comparar</span>
                                <span v-if="dash.debt > 0" class="pill">+ {{ formatCents(dash.debt) }} em aberto</span>
                            </div>
                        </div>

                        <div class="grid2">
                            <div class="stat">
                                <div class="k">Minha parte</div>
                                <div class="v num" :class="{ pos: dash.minePaid && dash.mineTotal }">{{ formatCents(dash.mineTotal) }}</div>
                                <div class="s">{{ !dash.mineTotal ? 'nada neste mês' : (dash.minePaid ? 'paga ✓' : 'em aberto') }}</div>
                            </div>
                            <div class="stat">
                                <div class="k">A receber</div>
                                <div class="v num" :class="{ neg: dash.receivable > 0 }">{{ formatCents(dash.receivable) }}</div>
                                <div class="s">{{ dash.debtors ? dash.debtors + (dash.debtors === 1 ? ' pessoa deve' : ' pessoas devem') : 'tudo em dia ✓' }}</div>
                            </div>
                        </div>

                        <div v-if="dash.dues.length" class="stack" style="gap:10px">
                            <div class="section-title"><h2>Vencimentos</h2></div>
                            <div class="card stack" style="gap:2px;padding:6px 16px">
                                <div v-for="d in dash.dues" :key="d.card.id" class="row between" style="padding:10px 0">
                                    <div class="row" style="min-width:0">
                                        <span class="cat-ico" :style="{ background: d.card.color || '#4338ca', color: '#fff' }"><svg class="i sm"><use href="#i-card"/></svg></span>
                                        <div style="min-width:0">
                                            <div class="truncate" style="font-weight:700;font-size:14px">{{ d.card.name }}</div>
                                            <div class="small muted" style="font-weight:600">dia {{ d.day }}</div>
                                        </div>
                                    </div>
                                    <div style="text-align:right">
                                        <div class="num" style="font-weight:800">{{ formatCents(d.amount) }}</div>
                                        <span class="pill" :class="dueClass(d)" style="margin-top:2px">{{ dueLabel(d) }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div v-if="dash.categories.length" class="stack" style="gap:10px">
                            <div class="section-title"><h2>Para onde foi o dinheiro</h2></div>
                            <div class="card stack" style="gap:14px">
                                <div v-for="c in dash.categories" :key="c.id" class="cat-row">
                                    <span class="cat-ico" :style="{ background: c.color + '22' }">{{ c.icon }}</span>
                                    <div class="grow">
                                        <div class="row between" style="margin-bottom:5px">
                                            <span style="font-weight:700;font-size:13px">{{ c.name }}</span>
                                            <span class="num small" style="font-weight:800">{{ formatCents(c.amount) }} <span class="muted">· {{ c.pct }}%</span></span>
                                        </div>
                                        <div class="meter"><div :style="{ width: c.pct + '%', background: c.color }"></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="stack" style="gap:10px">
                            <div class="section-title"><h2>Últimos 6 meses</h2></div>
                            <div class="card">
                                <div class="bars">
                                    <div v-for="t in dash.trend" :key="t.month" class="col" :class="{ active: t.active }">
                                        <span class="amt num">{{ t.value ? Math.round(t.value / 100).toLocaleString('pt-BR') : '' }}</span>
                                        <div class="bar" :style="{ height: t.h + '%' }"></div>
                                        <span class="lbl">{{ t.label }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div v-if="!hasTransactions" class="empty card flat">
                            <span class="big">🧾</span>
                            <strong>Nenhum lançamento ainda</strong>
                            Toque no <b>+</b> ou no microfone para registrar sua primeira compra.
                        </div>
                    </template>
                </div>

                <!-- ================= LANÇAMENTOS ================= -->
                <div v-else-if="currentTab === 'tx'" key="tx" class="stack" style="gap:12px">
                    <div class="section-title"><h2>Lançamentos</h2><span class="count">{{ filteredTransactions.length }}</span></div>

                    <div class="prefix">
                        <span style="left:14px"><svg class="i sm"><use href="#i-search"/></svg></span>
                        <input class="input" style="padding-left:40px" v-model="searchQuery" type="search" placeholder="Buscar descrição, pessoa ou cartão">
                    </div>

                    <div v-if="people.length > 1" class="chips">
                        <button class="chip" :class="{ on: personFilter === 'all' }" @click="personFilter = 'all'">Todos</button>
                        <button v-for="p in people" :key="p" class="chip" :class="{ on: personFilter === p }" @click="personFilter = p">{{ p }}</button>
                    </div>
                    <div v-if="usedCategories.length > 1" class="chips">
                        <button class="chip" :class="{ on: categoryFilter === 'all' }" @click="categoryFilter = 'all'">Todas as categorias</button>
                        <button v-for="c in usedCategories" :key="c.id" class="chip" :class="{ on: categoryFilter === c.id }" @click="categoryFilter = c.id">{{ c.icon }} {{ c.name }}</button>
                    </div>

                    <div v-if="!filteredTransactions.length" class="empty card flat">
                        <span class="big">🔎</span>
                        <strong>{{ hasTransactions ? 'Nada encontrado' : 'Nenhum lançamento ainda' }}</strong>
                        {{ hasTransactions ? 'Ajuste a busca ou os filtros.' : 'Toque no + para registrar uma compra.' }}
                    </div>

                    <template v-else>
                        <div v-for="g in groupedTransactions" :key="g.date" class="list">
                            <div class="day-label">{{ g.label }}</div>
                            <button v-for="tx in g.items" :key="tx.id" class="item" style="text-align:left;width:100%" @click="editTransaction(tx)">
                                <span class="ico" :style="{ background: getCategory(tx.category).color + '22' }">{{ getCategory(tx.category).icon }}</span>
                                <span class="grow">
                                    <span class="title truncate" style="display:block">{{ tx.description }}</span>
                                    <span class="meta">
                                        <span class="row" style="gap:5px"><span class="swatch" :style="{ background: getPersonColor(tx.person) }"></span>{{ tx.person }}</span>
                                        <span>{{ getCardName(tx.cardId) }}</span>
                                        <span v-if="tx.type === 'installment'" class="tag brand">{{ tx.installments }}x</span>
                                        <span v-else-if="tx.type === 'subscription'" class="tag warn">Mensal</span>
                                    </span>
                                </span>
                                <span class="amount num">
                                    {{ formatMoney(tx.amount) }}
                                    <small v-if="tx.type === 'installment'">{{ tx.installments }}x {{ formatMoney(tx.amount / tx.installments) }}</small>
                                </span>
                            </button>
                        </div>
                        <button v-if="filteredTransactions.length > visibleCount" class="btn block" @click="visibleCount += 30">
                            Ver mais ({{ filteredTransactions.length - visibleCount }})
                        </button>
                    </template>
                </div>

                <!-- ================= FATURAS ================= -->
                <div v-else-if="currentTab === 'bills'" key="bills" class="stack" style="gap:14px">

                    <div class="month-nav">
                        <button class="icon-btn" @click="navigateMonth(-1)" aria-label="Mês anterior"><svg class="i"><use href="#i-left"/></svg></button>
                        <div class="label">
                            <strong>{{ formatMonthLabel(viewMonth) }}</strong>
                            <button v-if="!isCurrentMonth" @click="goToday">Voltar para hoje</button>
                            <input v-model="viewMonth" type="month" aria-label="Escolher mês">
                        </div>
                        <button class="icon-btn" @click="navigateMonth(1)" aria-label="Próximo mês"><svg class="i"><use href="#i-right"/></svg></button>
                    </div>

                    <div v-if="cards.length > 1" class="chips">
                        <button class="chip" :class="{ on: cardFilter === 'all' }" @click="cardFilter = 'all'">Todos os cartões</button>
                        <button v-for="c in cards" :key="c.id" class="chip" :class="{ on: cardFilter === c.id }" @click="cardFilter = c.id">{{ c.name }}</button>
                    </div>

                    <div v-if="!invoiceView" class="empty card flat">
                        <span class="big">🌴</span>
                        <strong>Nenhum gasto neste mês</strong>
                        Navegue para outro mês ou adicione um lançamento.
                    </div>

                    <template v-else>
                        <div class="hero">
                            <div class="row between"><span class="label">Total a receber / pagar</span><span class="pill">{{ invoiceView.people.length }} {{ invoiceView.people.length === 1 ? 'pessoa' : 'pessoas' }}</span></div>
                            <div class="value num">{{ formatCents(invoiceView.total) }}</div>
                            <div class="split-bar">
                                <div v-for="p in invoiceView.people" :key="p.name" :style="{ width: (p.total / invoiceView.total * 100) + '%', background: getPersonColor(p.name) }" :title="p.name"></div>
                            </div>
                            <div class="row between small" style="margin-top:10px;position:relative;z-index:1;opacity:.9;font-weight:700">
                                <span>{{ formatCents(invoiceView.paidCents) }} pago</span><span>{{ invoiceView.pct }}%</span>
                            </div>
                        </div>

                        <div v-for="p in invoiceView.people" :key="p.name" class="card">
                            <div class="row between">
                                <div class="person-head">
                                    <span class="person-dot" :style="{ background: getPersonColor(p.name) }">{{ initial(p.name) }}</span>
                                    <div><div style="font-weight:800">{{ p.name }}</div><div class="small muted" style="font-weight:600">{{ p.items.length }} {{ p.items.length === 1 ? 'item' : 'itens' }}</div></div>
                                </div>
                                <button class="status-btn" :class="p.paid ? 'paid' : 'pending'" @click="togglePayment(viewMonth, p.name)">
                                    <svg v-if="p.paid" class="i sm"><use href="#i-check"/></svg>{{ p.paid ? 'Pago' : 'Pendente' }}
                                </button>
                            </div>

                            <div class="sub-row"><span class="lbl-up" style="margin:0">Total</span><span class="t num" :class="{ done: p.paid }">{{ formatCents(p.total) }}</span></div>

                            <div class="lines">
                                <component :is="item.isDebt ? 'div' : 'button'" v-for="item in p.items" :key="item.id + '-' + item.parcelaInfo"
                                           class="line" :class="{ debt: item.isDebt }" style="text-align:left;width:100%"
                                           @click="!item.isDebt && editTransactionById(item.id)">
                                    <span class="d truncate">{{ item.isDebt ? '⚠️ ' : '' }}{{ item.desc }}<small v-if="item.parcelaInfo">{{ item.parcelaInfo }}</small></span>
                                    <span class="a num">{{ formatCents(item.amount) }}</span>
                                </component>
                            </div>

                            <div class="row" style="margin-top:12px;gap:8px">
                                <button class="btn wa sm grow" @click="exportToWhatsApp(p)"><svg class="i sm"><use href="#i-wa"/></svg>Cobrar no WhatsApp</button>
                                <button class="btn sm" @click="copySummary(p)" aria-label="Copiar resumo"><svg class="i sm"><use href="#i-copy"/></svg>Copiar</button>
                            </div>
                        </div>

                        <button class="btn block" @click="exportCsv"><svg class="i sm"><use href="#i-download"/></svg>Exportar mês (planilha CSV)</button>
                    </template>
                </div>

                <!-- ================= AJUSTES ================= -->
                <div v-else key="settings" class="stack" style="gap:14px">

                    <div class="section-title"><h2>Aparência</h2></div>
                    <div class="card">
                        <div class="seg">
                            <button :class="{ on: themePref === 'auto' }" @click="setTheme('auto')">Automático</button>
                            <button :class="{ on: themePref === 'light' }" @click="setTheme('light')">Claro</button>
                            <button :class="{ on: themePref === 'dark' }" @click="setTheme('dark')">Escuro</button>
                        </div>
                    </div>

                    <div class="section-title"><h2>Cartões</h2><button class="btn ghost sm" @click="openNewCard"><svg class="i sm"><use href="#i-plus"/></svg>Novo</button></div>
                    <div v-if="!cards.length" class="empty card flat"><span class="big">💳</span><strong>Nenhum cartão</strong>Cadastre um cartão para começar a lançar compras.</div>
                    <div v-for="c in cards" :key="c.id" class="credit" :style="{ background: 'linear-gradient(135deg,' + (c.color || '#4338ca') + ', color-mix(in srgb,' + (c.color || '#4338ca') + ' 55%, #000))' }">
                        <div class="actions">
                            <button @click="editCard(c)" aria-label="Editar cartão"><svg class="i sm"><use href="#i-edit"/></svg></button>
                            <button @click="confirmDeleteCard(c)" aria-label="Excluir cartão"><svg class="i sm"><use href="#i-trash"/></svg></button>
                        </div>
                        <div class="name">{{ c.name }}</div>
                        <div class="dates"><span>Fecha<b>dia {{ c.closingDay }}</b></span><span>Vence<b>dia {{ c.dueDay }}</b></span><span>Compras<b>{{ cardUsage(c.id) }}</b></span></div>
                    </div>

                    <div class="section-title"><h2>Pessoas</h2><span class="count">{{ people.length }}</span></div>
                    <div class="card stack">
                        <div class="row">
                            <input class="input grow" v-model="newPerson" @keyup.enter="addPerson" placeholder="Nome (ex.: Maria)">
                            <button class="btn primary" @click="addPerson" aria-label="Adicionar pessoa"><svg class="i"><use href="#i-plus"/></svg></button>
                        </div>
                        <div class="stack" style="gap:2px">
                            <div v-for="(p, idx) in people" :key="p" class="row between" style="padding:6px 0">
                                <div class="row" style="min-width:0">
                                    <button class="person-dot" style="width:34px;height:34px;border-radius:11px;font-size:14px" :style="{ background: getPersonColor(p) }" @click="cyclePersonColor(p)" title="Trocar cor">{{ initial(p) }}</button>
                                    <div style="min-width:0"><div class="truncate" style="font-weight:700">{{ p }}</div><div v-if="idx === 0" class="small muted" style="font-weight:600">você</div></div>
                                </div>
                                <div class="row" style="gap:0">
                                    <button class="mini-btn" @click="clearPastDebts(p)" title="Quitar histórico anterior ao mês atual" aria-label="Quitar histórico"><svg class="i sm"><use href="#i-check"/></svg></button>
                                    <button class="mini-btn" @click="openEditPersonModal(p)" aria-label="Renomear"><svg class="i sm"><use href="#i-edit"/></svg></button>
                                    <button v-if="idx !== 0" class="mini-btn bad" @click="confirmRemovePerson(p)" aria-label="Remover"><svg class="i sm"><use href="#i-trash"/></svg></button>
                                </div>
                            </div>
                        </div>
                        <p class="hint">Toque no círculo colorido para trocar a cor. O ✓ marca como pagas todas as faturas anteriores ao mês atual.</p>
                    </div>

                    <div class="section-title"><h2>Cobrança por PIX</h2></div>
                    <div class="card stack">
                        <p class="hint" style="margin:0">Sua chave PIX é incluída automaticamente nas mensagens de cobrança.</p>
                        <div class="row">
                            <input class="input grow" v-model="userPixKey" placeholder="CPF, e-mail, telefone ou chave aleatória">
                            <button class="btn" @click="savePixKey">Salvar</button>
                        </div>
                        <button v-if="userPixKey" class="btn ghost" style="align-self:flex-start" @click="copyPix"><svg class="i sm"><use href="#i-copy"/></svg>Copiar chave</button>
                    </div>

                    <div class="section-title"><h2>Inteligência artificial</h2></div>
                    <div class="card stack">
                        <p class="hint" style="margin:0">Lance compras falando. A voz é transcrita pelo <b>Whisper</b> e interpretada pelo modelo escolhido, ambos na Groq Cloud.</p>
                        <div class="field">
                            <label>Chave de API da Groq <a class="link" style="float:right;text-transform:none;letter-spacing:0" href="https://console.groq.com/keys" target="_blank" rel="noopener">Obter grátis <svg class="i sm" style="vertical-align:-3px"><use href="#i-external"/></svg></a></label>
                            <div class="prefix">
                                <input class="input" style="padding-left:14px;padding-right:80px;font-family:ui-monospace,monospace;font-size:13px" v-model="groqApiKey" :type="showGroqKey ? 'text' : 'password'" placeholder="gsk_…" autocomplete="off">
                                <button class="link" style="position:absolute;right:14px;top:50%;transform:translateY(-50%)" @click="showGroqKey = !showGroqKey">{{ showGroqKey ? 'Ocultar' : 'Mostrar' }}</button>
                            </div>
                        </div>
                        <div class="field">
                            <label>Modelo</label>
                            <input class="input" style="font-family:ui-monospace,monospace;font-size:13px" v-model="groqModel" placeholder="openai/gpt-oss-120b">
                            <div class="chips" style="margin-top:8px">
                                <button v-for="m in GROQ_MODELS" :key="m" class="chip" :class="{ on: groqModel === m }" @click="groqModel = m">{{ m }}</button>
                            </div>
                        </div>
                        <div class="row between">
                            <span style="font-size:13px;font-weight:600;color:var(--ink-2)">Lançar automaticamente após 3 s</span>
                            <button class="switch" :class="{ on: groqAutoConfirm }" role="switch" :aria-checked="groqAutoConfirm" @click="groqAutoConfirm = !groqAutoConfirm"></button>
                        </div>
                        <div class="row">
                            <button class="btn primary grow" @click="saveGroqSettings">Salvar</button>
                            <button class="btn" :disabled="groqTesting" @click="testGroqConnection">{{ groqTesting ? 'Testando…' : 'Testar' }}</button>
                        </div>
                    </div>

                    <div class="section-title"><h2>Dados</h2></div>
                    <div class="grid2">
                        <button class="btn" @click="exportBackup"><svg class="i sm"><use href="#i-download"/></svg>Backup</button>
                        <label class="btn" style="cursor:pointer"><svg class="i sm"><use href="#i-upload"/></svg>Restaurar<input type="file" accept=".json,application/json" hidden @change="importBackup"></label>
                    </div>
                    <p class="hint" style="text-align:center;margin:0">Gestor de Faturas · v{{ APP_VERSION }}</p>
                </div>
            </transition>
        </main>

        <!-- ================= NAVEGAÇÃO ================= -->
        <nav class="tabbar" aria-label="Navegação principal">
            <button class="tab" :class="{ on: currentTab === 'home' }" @click="goTab('home')"><span class="pip"><svg class="i"><use href="#i-home"/></svg></span>Início</button>
            <button class="tab" :class="{ on: currentTab === 'tx' }" @click="goTab('tx')"><span class="pip"><svg class="i"><use href="#i-list"/></svg></span>Lançamentos</button>
            <button class="fab" @click="openNewTx()" aria-label="Novo lançamento"><svg class="i lg"><use href="#i-plus"/></svg></button>
            <button class="tab" :class="{ on: currentTab === 'bills' }" @click="goTab('bills')"><span class="pip"><svg class="i"><use href="#i-receipt"/></svg></span>Faturas</button>
            <button class="tab" :class="{ on: currentTab === 'settings' }" @click="goTab('settings')"><span class="pip"><svg class="i"><use href="#i-sliders"/></svg></span>Ajustes</button>
        </nav>

        <!-- ================= FORMULÁRIO DE LANÇAMENTO ================= -->
        <div v-if="txSheetOpen" class="overlay" @click.self="closeTxSheet">
            <form class="sheet stack" role="dialog" aria-modal="true" @submit.prevent="saveTransaction">
                <div class="grab"></div>
                <div class="sheet-head" style="margin-bottom:0">
                    <h3>{{ isEditingTx ? 'Editar lançamento' : 'Novo lançamento' }}</h3>
                    <div class="row" style="gap:8px">
                        <button v-if="!isEditingTx" type="button" class="icon-btn" @click="closeTxSheet(); openVoiceModal()" aria-label="Preencher por voz"><svg class="i"><use href="#i-mic"/></svg></button>
                        <button type="button" class="icon-btn" @click="closeTxSheet" aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button>
                    </div>
                </div>

                <div class="field">
                    <label>Valor {{ formTx.type === 'installment' ? (formTx.amountType === 'total' ? '(total da compra)' : '(de cada parcela)') : (formTx.type === 'subscription' ? '(por mês)' : '') }}</label>
                    <div class="prefix"><span>R$</span><input class="input money num" v-model.number="formTx.amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required></div>
                </div>

                <div class="field">
                    <label>Descrição</label>
                    <input class="input" v-model="formTx.description" type="text" required maxlength="60" placeholder="Ex.: Supermercado, Netflix, Restaurante">
                </div>

                <div class="seg">
                    <button type="button" :class="{ on: formTx.type === 'single' }" @click="formTx.type = 'single'">À vista</button>
                    <button type="button" :class="{ on: formTx.type === 'installment' }" @click="formTx.type = 'installment'">Parcelada</button>
                    <button type="button" :class="{ on: formTx.type === 'subscription' }" @click="formTx.type = 'subscription'">Mensal</button>
                </div>

                <div v-if="formTx.type === 'installment'" class="card flat stack" style="background:var(--brand-soft);border-color:transparent;gap:10px">
                    <div class="row between">
                        <span style="font-weight:700;font-size:13px">Parcelas</span>
                        <input class="input" style="width:84px;text-align:center;font-weight:800" v-model.number="formTx.installments" type="number" inputmode="numeric" min="2" max="120">
                    </div>
                    <div class="chips" style="margin:0 -16px">
                        <button v-for="n in [2, 3, 4, 6, 10, 12, 18, 24]" :key="n" type="button" class="chip" :class="{ on: formTx.installments === n }" @click="formTx.installments = n">{{ n }}x</button>
                    </div>
                    <div class="seg" style="background:var(--surface)">
                        <button type="button" :class="{ on: formTx.amountType === 'total' }" @click="formTx.amountType = 'total'">Valor total</button>
                        <button type="button" :class="{ on: formTx.amountType === 'installment' }" @click="formTx.amountType = 'installment'">Por parcela</button>
                    </div>
                    <div v-if="installmentPreview" class="small" style="font-weight:800;color:var(--brand);text-align:center">{{ installmentPreview }}</div>
                </div>

                <div v-if="formTx.type === 'subscription'" class="field">
                    <label>Encerra em (opcional)</label>
                    <input class="input" v-model="formTx.endMonth" type="month">
                    <p class="hint" style="margin:6px 0 0">Sem data final, a cobrança continua se repetindo todo mês.</p>
                </div>

                <div class="field">
                    <label>Categoria</label>
                    <div class="chips">
                        <button v-for="c in CATEGORIES" :key="c.id" type="button" class="chip" :class="{ on: formTx.category === c.id }" @click="formTx.category = c.id; categoryTouched = true">{{ c.icon }} {{ c.name }}</button>
                    </div>
                </div>

                <div class="grid2">
                    <div class="field">
                        <label>Cartão</label>
                        <select class="input" v-model="formTx.cardId" required>
                            <option disabled value="">Selecione…</option>
                            <option v-for="c in cards" :key="c.id" :value="c.id">{{ c.name }}</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Quem gastou</label>
                        <select class="input" v-model="formTx.person" @change="handlePersonSelectChange" required>
                            <option v-for="p in people" :key="p" :value="p">{{ p }}</option>
                            <option value="__new__">+ Nova pessoa…</option>
                        </select>
                    </div>
                </div>
                <p v-if="!cards.length" class="err">Você ainda não tem cartões. <button type="button" class="link" @click="closeTxSheet(); goTab('settings'); openNewCard()">Cadastrar agora</button></p>

                <div class="field">
                    <label>Data da compra</label>
                    <input class="input" v-model="formTx.date" type="date" required>
                </div>

                <p v-if="formError" class="err" role="alert">{{ formError }}</p>

                <button class="btn primary block" type="submit">{{ isEditingTx ? 'Salvar alterações' : 'Salvar lançamento' }}</button>
                <div v-if="isEditingTx" class="grid2">
                    <button type="button" class="btn" @click="duplicateTransaction(isEditingTx)"><svg class="i sm"><use href="#i-copy"/></svg>Duplicar</button>
                    <button type="button" class="btn danger" @click="deleteTransaction(isEditingTx)"><svg class="i sm"><use href="#i-trash"/></svg>Excluir</button>
                </div>
            </form>
        </div>

        <!-- ================= FORMULÁRIO DE CARTÃO ================= -->
        <div v-if="cardSheetOpen" class="overlay" @click.self="cardSheetOpen = false">
            <form class="sheet stack" role="dialog" aria-modal="true" @submit.prevent="saveCard">
                <div class="grab"></div>
                <div class="sheet-head" style="margin-bottom:0">
                    <h3>{{ isEditingCard ? 'Editar cartão' : 'Novo cartão' }}</h3>
                    <button type="button" class="icon-btn" @click="cardSheetOpen = false" aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button>
                </div>
                <div class="field"><label>Nome / banco</label><input class="input" v-model="formCard.name" required maxlength="30" placeholder="Ex.: Nubank, Itaú, C6"></div>
                <div class="grid2">
                    <div class="field"><label>Dia do fechamento</label><input class="input" v-model.number="formCard.closingDay" type="number" inputmode="numeric" min="1" max="31" required></div>
                    <div class="field"><label>Dia do vencimento</label><input class="input" v-model.number="formCard.dueDay" type="number" inputmode="numeric" min="1" max="31" required></div>
                </div>
                <div class="field">
                    <label>Cor</label>
                    <div class="color-picker">
                        <button v-for="c in CARD_COLORS" :key="c" type="button" :class="{ on: formCard.color === c }" :style="{ background: c }" @click="formCard.color = c" :aria-label="'Cor ' + c"></button>
                    </div>
                </div>
                <p v-if="cardError" class="err" role="alert">{{ cardError }}</p>
                <button class="btn primary block" type="submit">{{ isEditingCard ? 'Salvar alterações' : 'Adicionar cartão' }}</button>
            </form>
        </div>

        <!-- ================= CONTA ================= -->
        <div v-if="profileModalOpen" class="overlay center" @click.self="profileModalOpen = false">
            <div class="dialog stack" role="dialog" aria-modal="true">
                <div class="row between"><h3>Conta</h3><button class="icon-btn" @click="profileModalOpen = false" aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button></div>
                <div class="row card flat" style="padding:12px">
                    <span class="person-dot" style="background:var(--brand)">{{ initial(user.email) }}</span>
                    <div style="min-width:0"><div class="truncate" style="font-weight:700">{{ user.email }}</div><div class="small muted" style="font-weight:600">{{ syncLabel }}</div></div>
                </div>
                <button class="btn block" @click="exportBackup(); profileModalOpen = false"><svg class="i sm"><use href="#i-download"/></svg>Fazer backup</button>
                <button class="btn danger block" @click="logout"><svg class="i sm"><use href="#i-logout"/></svg>Sair da conta</button>
            </div>
        </div>

        <!-- ================= CONFIRMAÇÃO / PROMPT ================= -->
        <div v-if="confirmDialog.show" class="overlay center" @click.self="confirmDialog.show = false">
            <div class="dialog stack" role="alertdialog" aria-modal="true">
                <div><h3>{{ confirmDialog.title }}</h3><p class="hint" style="margin:6px 0 0;font-size:14px">{{ confirmDialog.message }}</p></div>
                <div class="grid2">
                    <button class="btn" @click="confirmDialog.show = false">Cancelar</button>
                    <button class="btn" :class="confirmDialog.danger ? 'danger' : 'primary'" @click="confirmDialog.onConfirm">{{ confirmDialog.confirmLabel }}</button>
                </div>
            </div>
        </div>

        <div v-if="promptDialog.show" class="overlay center" @click.self="promptDialog.show = false">
            <form class="dialog stack" @submit.prevent="promptDialog.onConfirm">
                <div><h3>{{ promptDialog.title }}</h3><p class="hint" style="margin:6px 0 0;font-size:14px">{{ promptDialog.message }}</p></div>
                <input class="input" v-model="promptDialog.value" autofocus maxlength="40">
                <div class="grid2">
                    <button type="button" class="btn" @click="promptDialog.show = false">Cancelar</button>
                    <button type="submit" class="btn primary">Salvar</button>
                </div>
            </form>
        </div>

        <!-- ================= VOZ ================= -->
        <div v-if="voiceModalOpen" class="overlay" @click.self="closeVoiceModal">
            <div class="sheet stack" role="dialog" aria-modal="true" style="gap:16px">
                <div class="grab"></div>
                <div class="sheet-head" style="margin-bottom:0">
                    <h3 class="row"><svg class="i" style="color:var(--brand)"><use href="#i-sparkle"/></svg>Lançar por voz</h3>
                    <button class="icon-btn" @click="closeVoiceModal" aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button>
                </div>

                <template v-if="voiceState === 'need_key'">
                    <div class="card flat" style="background:var(--brand-soft);border-color:transparent;text-align:center">
                        <strong>Chave da Groq necessária</strong>
                        <p class="hint" style="margin:4px 0 0">É grátis e leva um minuto para criar. Ela fica salva só na sua conta.</p>
                    </div>
                    <div class="field">
                        <label>Chave de API <a class="link" style="float:right;text-transform:none;letter-spacing:0" href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com ↗</a></label>
                        <input class="input" v-model="groqApiKey" type="password" placeholder="gsk_…" autocomplete="off">
                    </div>
                    <button class="btn primary block" :disabled="!groqApiKey.trim()" @click="saveGroqSettings">Salvar e continuar</button>
                </template>

                <template v-else-if="voiceState === 'ready'">
                    <button class="mic" @click="startVoiceRecording" aria-label="Começar a gravar"><svg class="i lg" style="width:34px;height:34px"><use href="#i-mic"/></svg></button>
                    <div style="text-align:center"><strong style="font-size:16px">Toque para falar</strong><p class="hint" style="margin:4px 0 0">Diga o que comprou, o valor, as parcelas, quem gastou e o cartão.</p></div>
                    <div class="stack" style="gap:8px">
                        <div class="quote">“Almoço de 45 reais e 50 centavos para o Carlos no Nubank hoje”</div>
                        <div class="quote">“Geladeira de 2400 reais em 10 vezes no Inter”</div>
                    </div>
                </template>

                <template v-else-if="voiceState === 'recording'">
                    <div class="mic rec"><svg class="i lg" style="width:34px;height:34px"><use href="#i-mic"/></svg></div>
                    <div style="text-align:center"><span class="pill bad num" style="font-size:13px">● {{ formatDuration(voiceRecordingDuration) }}</span><p class="hint" style="margin:8px 0 0">Ouvindo… fale com clareza.</p></div>
                    <div class="grid2">
                        <button class="btn" @click="cancelVoiceRecording">Cancelar</button>
                        <button class="btn primary" @click="stopVoiceRecording"><svg class="i sm"><use href="#i-check"/></svg>Concluir</button>
                    </div>
                </template>

                <template v-else-if="voiceState === 'processing'">
                    <div style="text-align:center;padding:18px 0">
                        <svg class="i spin" style="width:44px;height:44px;color:var(--brand)" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>
                        <p style="font-weight:700;margin:12px 0 0">{{ voiceProcessingStep }}</p>
                    </div>
                </template>

                <template v-else-if="voiceState === 'review' && voiceParsedData">
                    <div class="quote">“{{ voiceTranscription }}”</div>
                    <div class="card flat stack" style="gap:10px">
                        <div class="row between">
                            <span class="row" style="font-weight:800"><span class="cat-ico" :style="{ background: getCategory(voiceParsedData.category).color + '22' }">{{ getCategory(voiceParsedData.category).icon }}</span>{{ voiceParsedData.description }}</span>
                            <span class="num" style="font-weight:800;font-size:18px">{{ formatMoney(voiceParsedData.amount) }}</span>
                        </div>
                        <div class="grid2 small" style="font-weight:700">
                            <div><div class="lbl-up" style="margin:0">Pessoa</div>{{ voiceParsedData.person }}</div>
                            <div><div class="lbl-up" style="margin:0">Cartão</div>{{ getCardName(voiceParsedData.cardId) }}</div>
                            <div><div class="lbl-up" style="margin:0">Condição</div>{{ voicePreviewCondition }}</div>
                            <div><div class="lbl-up" style="margin:0">Data</div>{{ formatDate(voiceParsedData.date) }}</div>
                        </div>
                    </div>
                    <div v-if="groqAutoConfirm && voiceAutoConfirmTimer > 0" class="stack" style="gap:6px">
                        <div class="row between small" style="font-weight:700"><span>Lançando em {{ voiceAutoConfirmTimer }}s…</span><button class="link" @click="cancelAutoConfirm">Pausar</button></div>
                        <div class="meter"><div style="background:var(--brand);transition:width 1s linear" :style="{ width: (voiceAutoConfirmTimer / 3 * 100) + '%' }"></div></div>
                    </div>
                    <div class="grid2">
                        <button class="btn" @click="editInFormFromVoice">Revisar</button>
                        <button class="btn ok" @click="applyVoiceTransaction"><svg class="i sm"><use href="#i-check"/></svg>Confirmar</button>
                    </div>
                </template>

                <template v-else-if="voiceState === 'error'">
                    <div class="card flat" style="background:var(--bad-soft);border-color:transparent;text-align:center">
                        <strong style="color:var(--bad)">Não foi possível concluir</strong>
                        <p class="hint" style="margin:4px 0 0;color:var(--bad)">{{ voiceErrorMessage }}</p>
                    </div>
                    <div class="grid2">
                        <button class="btn" @click="voiceState = 'need_key'">Verificar chave</button>
                        <button class="btn primary" @click="voiceState = 'ready'">Tentar de novo</button>
                    </div>
                </template>
            </div>
        </div>

    </template>

    <!-- ================= AVISO ================= -->
    <transition name="toast">
        <div v-if="toast.show" class="toast" :class="toast.type" role="status">
            <span>{{ toast.message }}</span>
            <button v-if="toast.action" @click="runToastAction">{{ toast.action.label }}</button>
        </div>
    </transition>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
