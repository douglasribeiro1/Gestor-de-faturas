<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gestor de Faturas - Controle Financeiro Inteligente</title>
    <meta name="description" content="Gerenciador inteligente e compartilhado de faturas e cartões de crédito.">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./icon.png" type="image/png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        slate: {
                            850: '#151f32',
                            900: '#0f172a',
                            950: '#090d16',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Vue 3 Prod -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b1120;
            color: #1e293b;
        }
        
        /* Suporte a tela cheia e barra de navegação virtual em smartphones */
        .tab-content { 
            padding-bottom: calc(90px + env(safe-area-inset-bottom)) !important; 
        }
        .safe-bottom {
            padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
        }
        .safe-top {
            padding-top: calc(0.5rem + env(safe-area-inset-top));
        }

        /* Animações e Transições */
        .fade-enter-active, .fade-leave-active { transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(4px); }

        .modal-enter-active, .modal-leave-active { transition: all 0.25s ease; }
        .modal-enter-from, .modal-leave-to { opacity: 0; transform: scale(0.95); }

        .toast-enter-active, .toast-leave-active { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateY(-20px); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

        [v-cloak] { display: none !important; }
        
        /* Glassmorphism & Cartão Virtual */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }
        .virtual-card-chip {
            width: 32px;
            height: 24px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border-radius: 4px;
            position: relative;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
        }

        /* Animações do Gravador de Voz com IA */
        @keyframes pulse-ring {
            0% { transform: scale(0.92); opacity: 0.8; }
            50% { transform: scale(1.22); opacity: 0.25; }
            100% { transform: scale(0.92); opacity: 0.8; }
        }
        .pulse-ring-anim {
            animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes sound-bar-anim {
            0%, 100% { height: 6px; }
            50% { height: 28px; }
        }
        .sound-bar {
            animation: sound-bar-anim 1s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-full antialiased text-slate-800 bg-slate-950 flex justify-center selection:bg-brand-500 selection:text-white">

<div id="app" v-cloak class="w-full max-w-md min-h-screen bg-slate-50 flex flex-col relative shadow-2xl overflow-x-hidden border-x border-slate-200/50">

    <!-- TOAST NOTIFICATIONS -->
    <transition name="toast">
        <div v-if="toast.show" 
             :class="[
                 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl shadow-xl border flex items-center gap-3 text-xs font-semibold max-w-[90%] transition-all',
                 toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-500/30 backdrop-blur-md' :
                 toast.type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-500/30 backdrop-blur-md' :
                 'bg-slate-900/90 text-slate-100 border-slate-700/50 backdrop-blur-md'
             ]">
            <span>{{ toast.icon }}</span>
            <span class="truncate">{{ toast.message }}</span>
        </div>
    </transition>

    <!-- ========================================== -->
    <!-- TELA DE AUTENTICAÇÃO (LOGIN / REGISTRO)   -->
    <!-- ========================================== -->
    <div v-if="!user" class="flex-1 flex flex-col justify-between p-6 bg-gradient-to-b from-slate-900 via-slate-850 to-slate-950 text-white min-h-screen">
        
        <!-- Header da Marca -->
        <div class="pt-8 text-center">
            <div class="inline-flex p-3 rounded-3xl bg-brand-500/10 border border-brand-400/20 shadow-inner mb-4">
                <img src="./icon.png" alt="Logo" class="w-16 h-16 rounded-2xl shadow-lg object-cover">
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white flex items-center justify-center gap-1.5">
                Gestor de Faturas
            </h1>
            <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">
                Controle compartilhado de cartões, faturas e divisões com facilidade e precisão.
            </p>
        </div>

        <!-- Formulário de Auth -->
        <div class="my-auto bg-slate-800/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-700/60 shadow-2xl space-y-4">
            
            <!-- Segmented switch Login / Cadastro -->
            <div class="grid grid-cols-2 p-1 bg-slate-900/70 rounded-2xl border border-slate-700/40 text-xs font-bold">
                <button type="button" @click="authMode = 'login'"
                        :class="authMode === 'login' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'"
                        class="py-2.5 rounded-xl transition-all">
                    Entrar
                </button>
                <button type="button" @click="authMode = 'signup'"
                        :class="authMode === 'signup' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'"
                        class="py-2.5 rounded-xl transition-all">
                    Criar Conta
                </button>
            </div>

            <form @submit.prevent="handleAuth" class="space-y-3.5">
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1.5">E-mail</label>
                    <div class="relative">
                        <input v-model="authForm.email" type="email" required placeholder="seu@email.com"
                               class="w-full bg-slate-900/90 border border-slate-700 text-white rounded-xl px-3.5 py-3 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition placeholder-slate-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1.5">Senha</label>
                    <input v-model="authForm.password" type="password" required placeholder="••••••••"
                           class="w-full bg-slate-900/90 border border-slate-700 text-white rounded-xl px-3.5 py-3 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition placeholder-slate-500">
                </div>

                <button type="submit" :disabled="loading"
                        class="w-full mt-2 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-brand-500/25 transition active:scale-[0.99] disabled:opacity-50 flex justify-center items-center gap-2">
                    <svg v-if="loading" class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span>{{ loading ? 'Processando...' : (authMode === 'login' ? 'Acessar Gestor' : 'Concluir Cadastro') }}</span>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center text-[11px] text-slate-500 py-2">
            Sincronização em nuvem segura via Google Firebase
        </div>
    </div>

    <!-- ========================================== -->
    <!-- APLICAÇÃO PRINCIPAL (USUÁRIO AUTENTICADO)  -->
    <!-- ========================================== -->
    <template v-else>

        <!-- TOP APP BAR (HEADER REFORMULADO) -->
        <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-30 shadow-md border-b border-slate-800 flex items-center justify-between safe-top">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 p-0.5 shadow-sm flex items-center justify-center">
                    <img src="./icon.png" alt="App Icon" class="w-full h-full rounded-[10px] object-cover">
                </div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-tight text-white leading-none">Gestor de Faturas</h1>
                    <p class="text-[10px] font-medium text-emerald-400 mt-0.5 flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <span>Nuvem Conectada</span>
                    </p>
                </div>
            </div>

            <!-- Botões de Ação Topo -->
            <div class="flex items-center gap-2">
                <!-- Botão Rápido de Lançamento por Voz -->
                <button @click="openVoiceModal" 
                        class="p-1.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white shadow-md shadow-purple-900/30 flex items-center justify-center transition active:scale-95" 
                        title="Lançamento por Voz com IA (Groq Whisper V3)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </button>

                <!-- Símbolo Estático de Nuvem Conectada -->
                <div class="p-1.5 rounded-xl bg-slate-800 border border-slate-700 text-emerald-400 flex items-center justify-center" 
                     title="Sincronizado na Nuvem">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"></path>
                    </svg>
                </div>

                <!-- Avatar / Menu Perfil -->
                <button @click="profileModalOpen = true" 
                        class="w-8 h-8 rounded-xl bg-gradient-to-br from-brand-600 to-indigo-600 text-white font-bold text-xs flex items-center justify-center shadow-sm border border-brand-400/30 hover:opacity-90 active:scale-95 transition">
                    {{ (user.email || 'U').charAt(0).toUpperCase() }}
                </button>
            </div>
        </header>

        <!-- CONTEÚDO PRINCIPAL (MAIN BODY) -->
        <main class="flex-1 overflow-y-auto tab-content p-4 space-y-4">
            <transition name="fade" mode="out-in">

                <!-- ========================================== -->
                <!-- ABA 1: LANÇAMENTOS (NOVO & RECENTES)       -->
                <!-- ========================================== -->
                <div v-if="currentTab === 'lancamentos'" key="lanc" class="space-y-4">
                    
                    <!-- Form Card -->
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80">
                        <div class="flex items-center justify-between mb-3.5">
                            <div class="flex items-center gap-2">
                                <span class="p-1.5 rounded-lg bg-brand-50 text-brand-600 font-bold">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                </span>
                                <h2 class="text-sm font-bold text-slate-800">
                                    {{ isEditingTx ? 'Editar Lançamento' : 'Novo Lançamento' }}
                                </h2>
                            </div>
                            <button v-if="isEditingTx" @click="cancelEditTx" class="text-xs text-rose-500 font-bold hover:underline">
                                Cancelar
                            </button>
                        </div>

                        <!-- Botão Chamativo de Lançamento por Voz com IA -->
                        <div v-if="!isEditingTx" class="mb-3.5">
                            <button type="button" @click="openVoiceModal"
                                    class="w-full relative overflow-hidden group bg-gradient-to-r from-purple-600 via-indigo-600 to-brand-600 hover:from-purple-500 hover:to-brand-500 text-white p-3 rounded-2xl font-bold text-xs shadow-md shadow-indigo-500/20 flex items-center justify-between transition active:scale-[0.98]">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-8 h-8 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center text-sm shadow-inner group-hover:scale-110 transition">
                                        🎙️
                                    </div>
                                    <div class="text-left">
                                        <p class="font-extrabold text-xs leading-tight flex items-center gap-1.5">
                                            <span>Falar com a IA</span>
                                            <span class="text-[9px] bg-emerald-400/25 text-emerald-200 px-1.5 py-0.5 rounded font-semibold">Groq Whisper V3</span>
                                        </p>
                                        <p class="text-[10px] text-white/80 font-medium mt-0.5">Lançamento 100% automático por voz</p>
                                    </div>
                                </div>
                                <span class="text-[11px] bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-xl font-extrabold tracking-wide uppercase flex items-center gap-1">
                                    <span>Falar</span>
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                                </span>
                            </button>
                        </div>

                        <form @submit.prevent="addTransaction" class="space-y-3">
                            <!-- Descrição -->
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Descrição</label>
                                <input v-model="formTx.description" type="text" required placeholder="Ex: Supermercado, Netflix, Restaurante"
                                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-800 outline-none focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-500/10 transition">
                            </div>

                            <!-- Tipo de Lançamento (Segmented Control) -->
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Tipo de Despesa</label>
                                <div class="grid grid-cols-3 gap-1.5 p-1 bg-slate-100 rounded-xl text-xs font-semibold text-slate-600">
                                    <button type="button" @click="formTx.type = 'single'"
                                            :class="formTx.type === 'single' ? 'bg-white text-brand-600 shadow-sm' : 'hover:text-slate-900'"
                                            class="py-2 rounded-lg transition text-center">
                                        À Vista
                                    </button>
                                    <button type="button" @click="formTx.type = 'installment'"
                                            :class="formTx.type === 'installment' ? 'bg-white text-brand-600 shadow-sm' : 'hover:text-slate-900'"
                                            class="py-2 rounded-lg transition text-center">
                                        Parcelada
                                    </button>
                                    <button type="button" @click="formTx.type = 'subscription'"
                                            :class="formTx.type === 'subscription' ? 'bg-white text-brand-600 shadow-sm' : 'hover:text-slate-900'"
                                            class="py-2 rounded-lg transition text-center">
                                        Mensal
                                    </button>
                                </div>
                            </div>

                            <!-- Valor e Data -->
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <div class="flex justify-between items-center mb-1">
                                        <label class="block text-[11px] font-bold text-slate-500 uppercase">Valor</label>
                                        <select v-if="formTx.type === 'installment'" v-model="formTx.amountType" 
                                                class="text-[10px] bg-brand-50 text-brand-700 border border-brand-200 rounded-md px-1.5 py-0.5 outline-none font-bold">
                                            <option value="total">Valor Total</option>
                                            <option value="installment">Por Parcela</option>
                                        </select>
                                    </div>
                                    <div class="relative">
                                        <span class="absolute left-3 top-2.5 text-xs font-bold text-slate-400">R$</span>
                                        <input v-model.number="formTx.amount" type="number" step="0.01" required placeholder="0,00"
                                               class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 outline-none focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-500/10 transition">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Data da Compra</label>
                                    <input v-model="formTx.date" type="date" required
                                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-medium text-slate-800 outline-none focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-500/10 transition">
                                </div>
                            </div>

                            <!-- Parcelas (se parcelado) -->
                            <div v-if="formTx.type === 'installment'" class="p-3 bg-brand-50/70 border border-brand-100 rounded-2xl space-y-2">
                                <div class="flex items-center justify-between">
                                    <label class="text-xs font-bold text-brand-900">Número de Parcelas</label>
                                    <input v-model.number="formTx.installments" type="number" min="2" max="60" required
                                           class="w-20 bg-white border border-brand-200 rounded-xl px-2 py-1.5 text-center font-bold text-brand-700 outline-none focus:border-brand-500 text-sm">
                                </div>
                                <div v-if="formTx.amount" class="text-[11px] font-semibold text-brand-700 flex items-center justify-between pt-1 border-t border-brand-200/50">
                                    <span>Resumo do Parcelamento:</span>
                                    <span>
                                        {{ formTx.amountType === 'total' 
                                            ? `${formTx.installments}x de ${formatMoney(formTx.amount / (formTx.installments || 1))}`
                                            : `${formTx.installments}x de ${formatMoney(formTx.amount)} (Total: ${formatMoney(formTx.amount * formTx.installments)})` 
                                        }}
                                    </span>
                                </div>
                            </div>

                            <!-- Cartão e Pessoa -->
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Cartão</label>
                                    <select v-model="formTx.cardId" required 
                                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold text-slate-800 outline-none focus:border-brand-500 focus:bg-white transition">
                                        <option disabled value="">Selecione o cartão...</option>
                                        <option v-for="card in cards" :value="card.id" :key="card.id">{{ card.name }}</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Dono do Gasto</label>
                                    <select v-model="formTx.person" @change="handlePersonSelectChange" required 
                                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold text-slate-800 outline-none focus:border-brand-500 focus:bg-white transition">
                                        <option v-for="p in people" :value="p" :key="p">{{ p }}</option>
                                        <option value="NEW_PERSON" class="font-bold text-brand-600">+ Nova Pessoa...</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Botões de Ação do Form -->
                            <div class="pt-1 flex gap-2">
                                <button v-if="isEditingTx" type="button" @click="cancelEditTx"
                                        class="w-1/3 bg-slate-100 text-slate-700 py-3 rounded-2xl font-bold text-xs hover:bg-slate-200 transition">
                                    Cancelar
                                </button>
                                <button type="submit" 
                                        class="flex-1 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white py-3 rounded-2xl font-bold text-xs shadow-lg shadow-brand-500/20 active:scale-[0.99] transition flex items-center justify-center gap-2">
                                    <span>{{ isEditingTx ? 'Atualizar Lançamento' : 'Salvar Lançamento' }}</span>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Lista de Recentes com Busca e Filtros -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Lançamentos Recentes</h3>
                            <span class="text-[11px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">
                                {{ filteredTransactions.length }} total
                            </span>
                        </div>

                        <!-- Barra de Busca -->
                        <div class="relative">
                            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <input v-model="searchQuery" type="text" placeholder="Buscar por descrição, pessoa ou cartão..."
                                   class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200/90 rounded-2xl text-xs font-medium text-slate-800 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/10 transition shadow-sm">
                            <button v-if="searchQuery" @click="searchQuery = ''" class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-slate-600">✕</button>
                        </div>

                        <!-- Empty State -->
                        <div v-if="filteredTransactions.length === 0" class="bg-white p-8 rounded-3xl text-center border border-dashed border-slate-200 text-slate-400">
                            <span class="text-3xl block mb-2">🧾</span>
                            <p class="text-xs font-bold text-slate-600">Nenhum lançamento encontrado</p>

                                <div class="flex items-center gap-3 min-w-0">
                                    <!-- Badge de Categoria/Tipo -->
                                    <div class="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-xs shrink-0"
                                         :style="{ backgroundColor: getPersonColor(tx.person) + '18', color: getPersonColor(tx.person) }">
                                        {{ tx.person.charAt(0).toUpperCase() }}
                                    </div>
                                    
                                    <div class="min-w-0">
                                        <p class="text-xs font-bold text-slate-800 truncate leading-tight">{{ tx.description }}</p>
                                        <div class="flex items-center gap-2 mt-1 text-[10px] text-slate-400 flex-wrap">
                                            <span class="font-medium text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded-md">{{ getCardName(tx.cardId) }}</span>
                                            <span>•</span>
                                            <span class="font-bold" :style="{ color: getPersonColor(tx.person) }">{{ tx.person }}</span>
                                            <span>•</span>
                                            <span>{{ formatDate(tx.date) }}</span>
                                            <span v-if="tx.type === 'installment'" class="bg-purple-50 text-purple-600 px-1.5 py-0.5 rounded-md font-bold">
                                                {{ tx.installments }}x
                                            </span>
                                            <span v-else-if="tx.type === 'subscription'" class="bg-amber-50 text-amber-600 px-1.5 py-0.5 rounded-md font-bold">
                                                Mensal
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div class="text-right flex items-center gap-2 shrink-0">
                                    <div>
                                        <p class="text-xs font-extrabold text-slate-900">{{ formatMoney(tx.amount) }}</p>
                                        <p v-if="tx.type === 'installment'" class="text-[9px] text-slate-400">
                                            {{ tx.installments }}x de {{ formatMoney(tx.amount / tx.installments) }}
                                        </p>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <button @click="editTransaction(tx)" class="p-1.5 text-brand-600 bg-brand-50 hover:bg-brand-100 rounded-lg transition" title="Editar">
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                        </button>
                                        <button @click="confirmDeleteTx(tx.id)" class="p-1.5 text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition" title="Excluir">
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ========================================== -->
                <!-- ABA 2: FATURAS & RELATÓRIOS (POR PESSOA)  -->
                <!-- ========================================== -->
                <div v-else-if="currentTab === 'relatorios'" key="rel" class="space-y-4">
                    
                    <!-- Seletor Rápido de Mês com Botões < e > -->
                    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                        <button @click="navigateMonth(-1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition" title="Mês Anterior">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" stroke-linecap="round" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        
                        <div class="text-center">
                            <p class="text-xs font-black text-slate-800 capitalize">{{ formatMonthLabel(reportMonth) }}</p>
                            <input v-model="reportMonth" type="month" class="text-[10px] text-brand-600 font-bold bg-transparent outline-none cursor-pointer">
                        </div>

                        <button @click="navigateMonth(1)" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition" title="Próximo Mês">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" stroke-linecap="round" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>

                    <!-- Caso não haja dados no mês -->
                    <div v-if="!currentInvoiceData || currentInvoiceData.total === 0" class="bg-white p-8 rounded-3xl text-center border border-slate-200 shadow-sm text-slate-400">
                        <span class="text-3xl block mb-2">🌴</span>
                        <p class="text-xs font-bold text-slate-700">Nenhum gasto registrado para este mês</p>
                        <p class="text-[11px] text-slate-400 mt-1">Navegue para outros meses ou adicione novos lançamentos.</p>
                    </div>

                    <!-- Resumo da Fatura & Cards por Pessoa -->
                    <div v-else class="space-y-4">
                        
                        <!-- Hero Total da Fatura -->
                        <div class="p-5 bg-gradient-to-br from-slate-900 via-slate-850 to-brand-950 rounded-3xl text-white shadow-xl border border-slate-800 relative overflow-hidden">
                            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl"></div>
                            
                            <div class="flex items-center justify-between text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">
                                <span>Total da Fatura</span>
                                <span class="bg-brand-500/20 text-brand-300 border border-brand-400/30 px-2 py-0.5 rounded-full text-[10px]">
                                    {{ Object.keys(currentInvoiceData.byPerson).length }} devedor(es)
                                </span>
                            </div>
                            
                            <p class="text-3xl font-black tracking-tight text-white mt-1">
                                {{ formatMoney(currentInvoiceData.total) }}
                            </p>

                            <!-- Barra de Distribuição de Gastos por Pessoa -->
                            <div class="mt-4 pt-3 border-t border-slate-800">
                                <div class="flex justify-between text-[10px] text-slate-400 font-semibold mb-1.5">
                                    <span>Divisão do Mês</span>
                                    <span>{{ reportStats.percentPaid }}% pago</span>
                                </div>
                                <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden flex">
                                    <div v-for="(data, pName) in currentInvoiceData.byPerson" :key="pName"
                                         :style="{ width: (data.total / currentInvoiceData.total * 100) + '%', backgroundColor: getPersonColor(pName) }"
                                         :title="pName + ': ' + formatMoney(data.total)"
                                         class="h-full transition-all"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Lista de Cards por Pessoa -->
                        <div class="space-y-3">
                            <div v-for="(data, personName) in currentInvoiceData.byPerson" :key="personName"
                                 class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden transition hover:shadow-md">
                                
                                <!-- Header do Card da Pessoa -->
                                <div class="p-4 bg-slate-50/80 border-b border-slate-100 flex items-center justify-between">
                                    <div class="flex items-center gap-2.5">
                                        <span class="w-3.5 h-3.5 rounded-full ring-4 ring-white shadow-sm" 
                                              :style="{ backgroundColor: getPersonColor(personName) }"></span>
                                        <div>
                                            <h4 class="text-xs font-black text-slate-800">{{ personName }}</h4>
                                            <p class="text-[10px] text-slate-400 font-semibold">
                                                {{ data.items.length }} {{ data.items.length === 1 ? 'item' : 'itens' }}
                                            </p>
                                        </div>
                                    </div>

                                    <div class="flex items-center gap-2">
                                        <!-- Botão Status Pago/Pendente -->
                                        <button @click="togglePayment(reportMonth, personName)" 
                                                :class="payments[reportMonth]?.[personName] 
                                                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' 
                                                    : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'"
                                                class="text-[10px] font-black px-2.5 py-1 rounded-full border transition flex items-center gap-1">
                                            <span v-if="payments[reportMonth]?.[personName]">✓ PAGO</span>
                                            <span v-else>⌛ PENDENTE</span>
                                        </button>

                                        <!-- Botão WhatsApp Cobrança -->
                                        <button @click="exportToWhatsApp(personName, data.total, data.items)"
                                                class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-xl shadow-sm transition active:scale-95 flex items-center justify-center"
                                                title="Enviar cobrança detalhada no WhatsApp">
                                            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.418-.099.823z"/></svg>
                                        </button>
                                    </div>
                                </div>

                                <!-- Valor Total e Lista de Itens -->
                                <div class="p-4 space-y-3">
                                    <div class="flex justify-between items-baseline">
                                        <span class="text-[11px] font-bold text-slate-400 uppercase">Subtotal</span>
                                        <span class="text-lg font-black text-slate-900" :class="{'line-through text-slate-400': payments[reportMonth]?.[personName]}">
                                            {{ formatMoney(data.total) }}
                                        </span>
                                    </div>

                                    <!-- Lista discriminada -->
                                    <div class="space-y-1.5 pt-2 border-t border-slate-100">
                                        <div v-for="item in data.items" :key="item.id" 
                                             :class="item.isDebt ? 'bg-rose-50/80 border-rose-200 text-rose-800' : 'text-slate-700'"
                                             class="flex justify-between items-center text-xs p-2 rounded-xl border border-transparent">
                                            
                                            <div class="truncate pr-2">
                                                <span class="font-bold">{{ item.desc }}</span>
                                                <span v-if="item.parcelaInfo" class="text-[10px] text-slate-500 font-semibold ml-1">
                                                    {{ item.parcelaInfo }}
                                                </span>
                                            </div>

                                            <div class="flex items-center gap-2 shrink-0">
                                                <span class="font-extrabold" :class="item.isDebt ? 'text-rose-700' : 'text-slate-900'">
                                                    {{ formatMoney(item.amount) }}
                                                </span>
                                                <div v-if="!item.isDebt" class="flex items-center gap-1">
                                                    <button @click="editTransactionById(item.id)" class="p-1 text-brand-600 hover:bg-brand-50 rounded" title="Editar">
                                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                                    </button>
                                                    <button @click="confirmDeleteTx(item.id)" class="p-1 text-rose-600 hover:bg-rose-50 rounded" title="Excluir">
                                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ========================================== -->
                <!-- ABA 3: AJUSTES & CONFIGURAÇÕES             -->
                <!-- ========================================== -->
                <div v-else-if="currentTab === 'config'" key="conf" class="space-y-4">
                    
                    <!-- Gerenciar Cartões de Crédito (com layout de Cartão Virtual) -->
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                                <span class="p-1.5 rounded-lg bg-indigo-50 text-indigo-600 font-bold">💳</span>
                                {{ isEditingCard ? 'Editar Cartão' : 'Meus Cartões de Crédito' }}
                            </h2>
                            <span class="text-[11px] font-bold text-slate-400">{{ cards.length }} cadastrado(s)</span>
                        </div>

                        <!-- Form de Cartão -->
                        <form @submit.prevent="addCard" class="space-y-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200/60">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nome do Cartão / Banco</label>
                                <input v-model="formCard.name" required placeholder="Ex: Nubank Ultravioleta, C6 Black, Itaú"
                                       class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold outline-none focus:border-brand-500">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Dia Fechamento</label>
                                    <input v-model.number="formCard.closingDay" type="number" min="1" max="31" required placeholder="Dia"
                                           class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Dia Vencimento</label>
                                    <input v-model.number="formCard.dueDay" type="number" min="1" max="31" required placeholder="Dia"
                                           class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold outline-none focus:border-brand-500">
                                </div>
                            </div>
                            <div class="flex gap-2 pt-1">
                                <button v-if="isEditingCard" type="button" @click="cancelEditCard"
                                        class="w-1/3 bg-slate-200 text-slate-700 py-2 rounded-xl text-xs font-bold">
                                    Cancelar
                                </button>
                                <button type="submit" 
                                        class="flex-1 bg-slate-900 text-white py-2 rounded-xl text-xs font-bold hover:bg-slate-800 transition">
                                    {{ isEditingCard ? 'Salvar Alterações' : '+ Adicionar Cartão' }}
                                </button>
                            </div>
                        </form>

                        <!-- Visualização de Cartões Virtuais -->
                        <div class="space-y-2.5">
                            <div v-for="card in cards" :key="card.id"
                                 class="p-4 rounded-2xl bg-gradient-to-tr from-slate-900 via-slate-800 to-indigo-950 text-white shadow-md border border-slate-700/50 flex items-center justify-between">
                                
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <div class="virtual-card-chip"></div>
                                        <p class="font-extrabold text-sm text-white tracking-wide">{{ card.name }}</p>
                                    </div>
                                    <p class="text-[11px] text-slate-300 font-medium">
                                        Fecha todo dia <span class="font-bold text-brand-300">{{ card.closingDay }}</span> • Vence dia <span class="font-bold text-emerald-300">{{ card.dueDay }}</span>
                                    </p>
                                </div>

                                <div class="flex items-center gap-1.5">
                                    <button @click="editCard(card)" class="p-2 text-brand-300 bg-slate-800 hover:bg-slate-700 rounded-xl transition" title="Editar Cartão">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                    </button>
                                    <button @click="confirmDeleteCard(card.id)" class="p-2 text-rose-400 bg-slate-800 hover:bg-slate-700 rounded-xl transition" title="Excluir Cartão">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Gerenciar Pessoas e Divisões -->
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 space-y-3.5">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                                <span class="p-1.5 rounded-lg bg-emerald-50 text-emerald-600 font-bold">👥</span>
                                Pessoas e Devedores
                            </h2>
                            <span class="text-[11px] font-bold text-slate-400">{{ people.length }} pessoa(s)</span>
                        </div>

                        <!-- Input Rápido Nova Pessoa -->
                        <div class="flex gap-2">
                            <input v-model="newPerson" @keyup.enter="addPerson" placeholder="Nome da pessoa (Ex: Maria, Carlos)" 
                                   class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold outline-none focus:border-brand-500">
                            <button @click="addPerson" class="bg-brand-600 hover:bg-brand-500 text-white px-4 rounded-xl font-black text-sm shadow-sm transition">
                                +
                            </button>
                        </div>

                        <!-- Lista de Pessoas com Tags -->
                        <div class="flex flex-wrap gap-2 pt-1">
                            <div v-for="p in people" :key="p" 
                                 class="bg-slate-50 border border-slate-200/80 pl-3 pr-2 py-1.5 rounded-2xl text-xs flex items-center gap-2 shadow-sm">
                                <span class="w-2.5 h-2.5 rounded-full" :style="{ backgroundColor: getPersonColor(p) }"></span>
                                <span class="font-extrabold text-slate-800">{{ p }}</span>
                                
                                <div class="flex items-center gap-1 ml-1 border-l pl-1.5 border-slate-200">
                                    <button @click="clearPastDebts(p)" class="p-1 text-emerald-600 hover:bg-emerald-50 rounded" title="Quitar todas as dívidas passadas">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    </button>
                                    <button @click="openEditPersonModal(p)" class="p-1 text-brand-600 hover:bg-brand-50 rounded" title="Editar Nome">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                    </button>
                                    <button v-if="p !== 'Eu'" @click="confirmRemovePerson(p)" class="p-1 text-rose-500 hover:bg-rose-50 rounded" title="Remover">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Configuração da Inteligência Artificial (Groq Cloud) -->
                    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200/80 space-y-3.5">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                                <span class="p-1.5 rounded-lg bg-purple-50 text-purple-600 font-bold">🎙️</span>
                                Inteligência Artificial (Groq Cloud)
                            </h2>
                            <span class="text-[10px] font-extrabold bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">
                                Whisper V3 + LLM
                            </span>
                        </div>
                        <p class="text-[11px] text-slate-500 leading-relaxed">
                            Permite lançar despesas por comando de voz. A fala é transcrita com <strong>Whisper V3 Large</strong> e interpretada com <strong>{{ groqModel }}</strong>.
                        </p>

                        <!-- Chave API Groq -->
                        <div class="space-y-1">
                            <div class="flex items-center justify-between">
                                <label class="block text-[11px] font-bold text-slate-600 uppercase">Chave de API do Groq</label>
                                <a href="https://console.groq.com/keys" target="_blank" class="text-[10px] text-brand-600 font-bold hover:underline flex items-center gap-1">
                                    <span>Obter chave grátis</span>
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                </a>
                            </div>
                            <div class="relative">
                                <input v-model="groqApiKey" :type="showGroqKey ? 'text' : 'password'" placeholder="gsk_..."
                                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-mono font-medium outline-none focus:border-brand-500 pr-10">
                                <button type="button" @click="showGroqKey = !showGroqKey" 
                                        class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-xs">
                                    {{ showGroqKey ? '👁️' : '🔒' }}
                                </button>
                            </div>
                        </div>

                        <!-- Modelo de Análise -->

                                    {{ voiceParsedData.type === 'installment' ? `${voiceParsedData.installments}x de ${formatMoney(voiceParsedData.amount / voiceParsedData.installments)}` : (voiceParsedData.type === 'subscription' ? 'Mensal' : 'À Vista') }}
                                </span>

                            <div>
                                <span class="text-slate-400 block text-[9px] font-bold uppercase">Data</span>
                                <span class="font-bold text-slate-700">{{ formatDate(voiceParsedData.date) }}</span>
                            </div>

                    </div>

                    <!-- Indicador de Auto-Confirm ou Ações -->
                    <div v-if="groqAutoConfirm && voiceAutoConfirmTimer > 0" class="space-y-1.5">
                        <div class="flex items-center justify-between text-[11px] font-bold text-purple-900">
                            <span>Lançando automaticamente em {{ voiceAutoConfirmTimer }}s...</span>
                            <button @click="cancelAutoConfirm" class="text-rose-600 hover:underline">Pausar</button>
                        </div>
                        <div class="w-full bg-purple-100 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-purple-600 h-full transition-all duration-1000" :style="{ width: (voiceAutoConfirmTimer / 3 * 100) + '%' }"></div>
